[package]
name = "nocknock-ingestion-worker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Urmanac"]

[dependencies]
# HTTP client for Alchemy
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }

# HTTP server
axum = "0.7"
tokio = { version = "1.38", features = ["full", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Configuration
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Scheduling
tokio-cron-scheduler = "0.12"

# Utilities
uuid = { version = "1.7", features = ["serde", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
ulid = "1.0"
sha2 = "0.10"
hex = "0.4"
once_cell = "1.19"

[[bin]]
name = "nocknock-ingestion-worker"
path = "src/main.rs"

[[bin]]
name = "nocknock-mcp"
path = "src/bin/mcp.rs"