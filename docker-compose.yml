version: '3.8'

services:
  # PostgreSQL with TimescaleDB extension for time-series snapshots
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: nocknock-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nocknock
    ports:
      - "5432:5432"
    volumes:
      - nocknock-db-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ingestion Worker — Rust daemon (polls Base via Alchemy, serves REST API)
  worker:
    build:
      context: ./ingestion-worker
      dockerfile: Dockerfile
    container_name: nocknock-worker
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/nocknock"
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  # Frontend — React dashboard served via Nginx reverse proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nocknock-frontend
    ports:
      - "3000:80"
    depends_on:
      - worker

volumes:
  nocknock-db-data: