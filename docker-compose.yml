version: '3.8'

services:
  # PostgreSQL with TimescaleDB extension for time-series snapshots
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: nocknock-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nocknock
    ports:
      - "5432:5432"
    volumes:
      - nocknock-db-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ingestion Worker — polls Alchemy, runs WASM brain, serves API
  worker:
    build:
      context: ./ingestion-worker
      dockerfile: Dockerfile
    container_name: nocknock-worker
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/nocknock?sslmode=disable"
      PORT: "8080"
      # Alchemy keys can be overridden at runtime
      # ALCHEMY_API_KEY_1: ${ALCHEMY_API_KEY_1}
      # ALCHEMY_API_KEY_2: ${ALCHEMY_API_KEY_2}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ingestion-worker/config.yaml:/app/config.yaml:ro
      - ./brain/target/wasm32-wasip1/release/nocknock_brain.wasm:/app/brain.wasm:ro

  # Frontend dev server (Vite + React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: nocknock-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE: "http://localhost:8080/v1"
    depends_on:
      - worker

volumes:
  nocknock-db-data: