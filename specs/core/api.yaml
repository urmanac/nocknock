openapi: 3.0.3
info:
  title: NockNock Asset Tracking API
  version: 1.0.0
  description: |
    REST API for the NockNock "Observe and Protect" asset state room.
    Backend: async ingestion engine (periodic Web3 polling → immutable snapshots).
    Frontend: calm monitoring portal consuming snapshots with freshness validation.

    **Design Principles:**
    - Backend never blocks on third-party calls during frontend requests
    - Every payload carries deterministic sync metadata (timestamp, state hash)
    - Frontend validates freshness locally; shows non-obtrusive stale indicator
    - Zero "act now" urgency — pure observation

servers:
  - url: http://localhost:8080/v1
    description: Local development
  - url: https://api.nocknock.xyz/v1
    description: Production

tags:
  - name: Snapshots
    description: Portfolio snapshot endpoints (primary data plane)
  - name: Health
    description: Liveness and ingestion status
  - name: Execution
    description: Golden Path claim-fees payload engine (zero-custody; clients dispatch unsigned txs to the paired wallet for signing)

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe and ingestion status
      operationId: getHealth
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Ingestion worker stalled or unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /snapshot/latest:
    get:
      tags: [Snapshots]
      summary: Get the most recent portfolio snapshot
      operationId: getLatestSnapshot
      description: |
        Returns the latest computed snapshot with full derived metrics.
        Frontend MUST check `meta.generated_at` against local clock and
        `SYNC_WINDOW_SECONDS` (default 300s) to determine freshness.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Latest snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotEnvelope'
          headers:
            ETag:
              description: The snapshot's state_hash (for conditional requests)
              schema:
                type: string
                pattern: '^[a-f0-9]{64}$'
            Last-Modified:
              description: RFC 7231 date of snapshot generation
              schema:
                type: string
                format: date-time
            Cache-Control:
              description: Revalidation directive for dynamic snapshot polling
              schema:
                type: string
                example: "no-cache, must-revalidate"
        '304':
          description: Not modified (client has current snapshot)
        '503':
          description: No snapshot available yet (ingestion not run)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /snapshot/historical:
    get:
      tags: [Snapshots]
      summary: Get historical snapshots for time-series charts
      operationId: getHistoricalSnapshots
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Paginated historical snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalResponse'
        '400':
          description: Invalid interval or pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /snapshot/metadata:
    get:
      tags: [Snapshots]
      summary: Get snapshot metadata only (for freshness polling)
      operationId: getSnapshotMetadata
      description: |
        Lightweight endpoint for frontend to check freshness without
        downloading full payload. Returns last N snapshots with age info.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Snapshot metadata list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResponse'

  /snapshot/{snapshot_id}:
    get:
      tags: [Snapshots]
      summary: Get a specific snapshot by ID
      operationId: getSnapshotById
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      responses:
        '200':
          description: Requested snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotEnvelope'
        '404':
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /execute/claim-fees/payload:
    get:
      tags: [Execution]
      summary: Build unsigned fee-claim transactions (Aerodrome + Uniswap V4)
      operationId: getClaimFeesPayload
      description: |
        Golden Path payload engine. Returns ready-to-sign unsigned transactions that
        collect accrued LP fees for the sovereign wallet on both AMMs:
        Aerodrome `claimFees()` and Uniswap V4 PositionManager collect
        (DECREASE_LIQUIDITY with 0 liquidity + TAKE_PAIR). Amounts derive from the
        latest live snapshot and each action is pre-simulated via eth_call; clients
        (web cockpit WalletConnect flow, future Android app) MUST only dispatch
        actions whose `simulation` is "success" and never build calldata themselves.
      responses:
        '200':
          description: Unsigned claim transactions with live amounts, gas estimate and simulation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimFeesPayload'
        '503':
          description: No snapshot yet, or no RPC key configured (explicit failure, never mock data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /execute/record-harvest:
    post:
      tags: [Execution]
      summary: Record a receipt-verified fee harvest in the ledger
      operationId: recordHarvest
      description: |
        Called by clients after the paired wallet confirms a claim transaction.
        The worker fetches the Base transaction receipt, verifies success, and
        extracts the ERC-20 Transfer logs (USDC/NOCK) paid to the sovereign wallet.
        Nothing is recorded without on-chain verification. A 404 RECEIPT_NOT_FOUND
        also covers the Uniswap-app pending-broadcast quirk (approved but not yet
        broadcast): surface "approved, awaiting wallet broadcast" and retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, tx_hash]
              properties:
                platform:
                  type: string
                  enum: [aerodrome, uniswap-v4]
                tx_hash:
                  type: string
                  description: 32-byte hex transaction hash (0x-prefixed or bare)
      responses:
        '200':
          description: Ledger rows recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded:
                    type: array
                    items:
                      type: object
                      properties:
                        platform: { type: string }
                        tx_hash: { type: string }
                        token_symbol: { type: string }
                        amount_human: { type: string }
                        usd_value: { type: string, nullable: true }
                        block_number: { type: integer }
                  already_present:
                    type: integer
        '404':
          description: Receipt not found on-chain (may be pending broadcast in the wallet)
        '409':
          description: Transfers already recorded (idempotent retry)
        '422':
          description: Invalid platform/hash, reverted transaction, or no tracked transfers
        '503':
          description: No RPC key configured

  /tax/export:
    get:
      tags: [Execution]
      summary: Koinly-compatible tax export of the harvest ledger
      operationId: exportTax
      description: |
        Exports the receipt-verified harvest ledger. Fee claims are tagged
        `income` and carry their Base tx hash; every row ties out to on-chain
        receipts. Rebalances/liquidity transfers are not yet ledgered (future
        work — they will export with a non-taxable `transfer` label).
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [koinly, csv, json]
            default: koinly
      responses:
        '200':
          description: Export payload (CSV attachment or JSON)
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
        '500':
          description: Ledger query failed
        '422':
          description: Unsupported format requested

components:
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag (state_hash) from previous request for conditional GET
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    SnapshotId:
      name: snapshot_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Maximum number of snapshots to return
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Before:
      name: before
      in: query
      description: Return snapshots before this timestamp (exclusive)
      schema:
        type: string
        format: date-time
    After:
      name: after
      in: query
      description: Return snapshots after this timestamp (inclusive)
      schema:
        type: string
        format: date-time

  schemas:
    # Re-use the envelope and meta from snapshot.yaml
    SnapshotEnvelope:
      $ref: './snapshot.yaml#/components/schemas/SnapshotEnvelope'
    SnapshotMeta:
      $ref: './snapshot.yaml#/components/schemas/SnapshotMeta'
    SnapshotData:
      $ref: './snapshot.yaml#/components/schemas/SnapshotData'

    HealthResponse:
      type: object
      required: [status, last_sync, ingestion_lag_seconds]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        last_sync:
          type: string
          format: date-time
          description: When ingestion last successfully completed
        ingestion_lag_seconds:
          type: integer
          description: Seconds since last successful ingestion run
        sync_duration_ms:
          type: integer
          description: Measured duration in milliseconds of the most recent sync cycle
        sync_window_seconds:
          type: integer
          description: Configured sync window interval in seconds
        errors:
          type: array
          items:
            type: string
          description: Recent error messages (if degraded/down)

    HistoricalResponse:
      type: object
      required: [snapshots, pagination]
      properties:
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotEnvelope'
        pagination:
          $ref: '#/components/schemas/Pagination'

    MetadataResponse:
      type: object
      required: [snapshots]
      properties:
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotMetadataEntry'

    SnapshotMetadataEntry:
      type: object
      required: [snapshot_id, generated_at, state_hash, age_seconds]
      properties:
        snapshot_id:
          type: string
          format: uuid
        generated_at:
          type: string
          format: date-time
        state_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        age_seconds:
          type: integer
          description: Seconds since this snapshot was generated

    Pagination:
      type: object
      required: [limit, returned, has_more]
      properties:
        limit:
          type: integer
        returned:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
          description: Cursor for next page (opaque)

    ErrorResponse:
      type: object
      required: [error, message, timestamp]
      properties:
        error:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "Snapshot 01ARZ3NDEKTSV4RRFFQ69G5FAV not found"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-09T17:23:29.123Z"
        details:
          type: object
          nullable: true

  ClaimFeesPayload:
    type: object
    required: [chain_id, from, generated_at, actions]
    properties:
      chain_id:
        type: integer
        example: 8453
      from:
        type: string
        description: Sovereign wallet that must sign (and receives the fees)
      generated_at:
        type: string
        format: date-time
      gross_usd:
        type: string
        nullable: true
        description: Total claimable fees in USD from the latest live snapshot
      estimated_gas_usd:
        type: string
        nullable: true
        description: Sum of live eth_estimateGas-based USD gas cost; null when unavailable
      net_after_gas_usd:
        type: string
        nullable: true
      actions:
        type: array
        items:
          $ref: '#/components/schemas/ClaimFeeAction'

  ClaimFeeAction:
    type: object
    required: [platform, label, to, data, value, simulation]
    properties:
      platform:
        type: string
        enum: [aerodrome, uniswap-v4]
      label:
        type: string
        example: "Claim Aerodrome LP fees (Tranche 2)"
      to:
        type: string
        description: Contract address (Aerodrome pool or Uniswap V4 PositionManager)
      data:
        type: string
        description: Full unsigned calldata (0x-prefixed)
      value:
        type: string
        example: "0x0"
      expected_amount_0:
        type: string
        nullable: true
        description: Expected USDC amount (human units) from simulation/snapshot
      expected_amount_1:
        type: string
        nullable: true
        description: Expected NOCK amount (human units)
      expected_usd:
        type: string
        nullable: true
      gas_estimate:
        type: string
        nullable: true
        description: eth_estimateGas result (hex wei-units of gas)
      gas_usd:
        type: string
        nullable: true
      simulation:
        type: string
        enum: [success, failed, unavailable]
        description: Clients MUST only dispatch "success"
      simulation_detail:
        type: string
        nullable: true

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Optional API key for rate limiting / multi-tenant

security:
  - ApiKeyAuth: []