openapi: 3.0.3
info:
  title: NockNock Asset Tracking API
  version: 1.0.0
  description: |
    REST API for the NockNock "Observe and Protect" asset state room.
    Backend: async ingestion engine (periodic Web3 polling → immutable snapshots).
    Frontend: calm monitoring portal consuming snapshots with freshness validation.

    **Design Principles:**
    - Backend never blocks on third-party calls during frontend requests
    - Every payload carries deterministic sync metadata (timestamp, state hash)
    - Frontend validates freshness locally; shows non-obtrusive stale indicator
    - Zero "act now" urgency — pure observation

    **Cross-site writes (v0.8.1, issue #133):** a POST is refused with 403
    `CROSS_SITE_REFUSED` before any handler runs when its `Sec-Fetch-Site` header is
    `cross-site`, or when it carries an `Origin` whose host is not the request's `Host`
    host (ports are not compared: nginx forwards the host without its port). Requests
    without `Origin` (curl, scripts, MCP clients) are unaffected, and so is every GET.
    Not covered: DNS rebinding (Origin and Host then name the same host) and a page
    served on another port of the same host; closing those needs a Host allow-list.
    The API has no authentication; it is meant for the LAN.

servers:
  - url: http://localhost:8080/v1
    description: Local development
  - url: https://api.nocknock.xyz/v1
    description: Production

tags:
  - name: Snapshots
    description: Portfolio snapshot endpoints (primary data plane)
  - name: Health
    description: Liveness and ingestion status
  - name: Execution
    description: Golden Path claim-fees payload engine (zero-custody; clients dispatch unsigned txs to the paired wallet for signing)
  - name: Notifications
    description: Channel readiness and a labelled test send (v0.6.0)

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe and ingestion status
      operationId: getHealth
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Ingestion worker stalled or unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /snapshot/latest:
    get:
      tags: [Snapshots]
      summary: Get the most recent portfolio snapshot
      operationId: getLatestSnapshot
      description: |
        Returns the latest computed snapshot with full derived metrics.
        Frontend MUST check `meta.generated_at` against local clock and
        `SYNC_WINDOW_SECONDS` (default 300s) to determine freshness.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Latest snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotEnvelope'
          headers:
            ETag:
              description: The snapshot's state_hash (for conditional requests)
              schema:
                type: string
                pattern: '^[a-f0-9]{64}$'
            Last-Modified:
              description: RFC 7231 date of snapshot generation
              schema:
                type: string
                format: date-time
            Cache-Control:
              description: Revalidation directive for dynamic snapshot polling
              schema:
                type: string
                example: "no-cache, must-revalidate"
        '304':
          description: Not modified (client has current snapshot)
        '503':
          description: >
            No snapshot available yet (error NO_SNAPSHOT). When an ingestion cycle has
            failed, the body's `detail` string carries the last ingestion error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /snapshot/historical:
    get:
      tags: [Snapshots]
      summary: Get historical snapshots for time-series charts
      operationId: getHistoricalSnapshots
      description: |
        Each row is slimmed for the charts, which read only its figures: the embedded
        counterfactual keeps its current point, structural channels and the cost-basis
        prose are dropped, and (v0.8.1, issue #136) `accumulation_plan.route_quotes` is
        null and `accumulation_plan.fill_detection.offers` and `.dismissed` are empty.
        Fill detection's status and check times stay. `/snapshot/latest` carries every
        field in full.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Paginated historical snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalResponse'
        '400':
          description: Invalid interval or pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /snapshot/metadata:
    get:
      tags: [Snapshots]
      summary: Get snapshot metadata only (for freshness polling)
      operationId: getSnapshotMetadata
      description: |
        Lightweight endpoint for frontend to check freshness without
        downloading full payload. Returns last N snapshots with age info.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Snapshot metadata list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResponse'

  /snapshot/{snapshot_id}:
    get:
      tags: [Snapshots]
      summary: Get a specific snapshot by ID
      operationId: getSnapshotById
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      responses:
        '200':
          description: Requested snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotEnvelope'
        '404':
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /execute/claim-fees/payload:
    get:
      tags: [Execution]
      summary: Build unsigned fee-claim transactions (Uniswap v4 positions)
      operationId: getClaimFeesPayload
      description: |
        Golden Path payload engine. Returns ready-to-sign unsigned transactions that
        collect accrued LP fees for the sovereign wallet on the tracked Uniswap v4
        positions (DECREASE_LIQUIDITY with 0 liquidity + TAKE_PAIR per position).
        The Aerodrome tranche was liquidated on 2026-10-23; no Aerodrome actions are
        built anymore. Amounts derive from the latest live snapshot and each action is
        pre-simulated via eth_call; clients (web cockpit WalletConnect flow, future
        Android app) MUST only dispatch actions whose `simulation` is "success" and
        never build calldata themselves. Since v0.9.0 the positions are config.yaml's
        entries and the database-tracked rows the latest snapshot holds (a row tracked
        a moment ago gets its action once a cycle has read it).
      responses:
        '200':
          description: Unsigned claim transactions with live amounts, gas estimate and simulation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimFeesPayload'
        '503':
          description: No snapshot yet, no RPC key configured, or TRACKED_POSITIONS_UNAVAILABLE (the tracked positions table could not be read, so the actions cannot be listed in full). An explicit failure, never mock data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /execute/record-accumulation:
    post:
      tags: [Execution]
      summary: Attach a confirmed USDC to NOCK purchase to the accumulation plan
      operationId: recordAccumulation
      description: |
        Called after the operator buys a dollar-cost-averaging tranche, wherever the
        swap was made. The worker fetches the Base transaction receipt, verifies
        success, and nets the USDC/NOCK Transfer logs touching the sovereign wallet;
        the transaction is accepted only if the wallet ended with less USDC and more
        NOCK. Amounts come from the logs, never from the request. Idempotent on tx_hash.
        This is the only write path into the accumulation ledger: confirming a swap
        that fill detection offered (v0.6.0) calls it with the offered hash, and the
        receipt is verified again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tx_hash]
              properties:
                tx_hash:
                  type: string
                  description: 32-byte hex transaction hash (0x-prefixed or bare)
      responses:
        '200':
          description: Fill recorded (or already present)
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded: { type: boolean }
                  duplicate: { type: boolean }
                  plan_id: { type: string }
                  tx_hash: { type: string }
                  usdc_spent: { type: string }
                  nock_received: { type: string }
                  effective_price_usd: { type: string }
                  block_number: { type: integer }
                  confirmed_at: { type: string, format: date-time }
                  reference_spot_usd: { type: string, nullable: true, description: "Stored NOCK/USD price that stands for the fill's block time, within 60 minutes (v0.6.0); the worker's own read is preferred and a backfilled candle counts as its open (#129); null when none was near. A fill confirmed from a detected swap keeps the reference its offer showed, so the two figures cannot differ." }
                  reference_spot_source: { type: string, nullable: true }
                  execution_cost_bps: { type: integer, nullable: true, description: "(effective price / reference spot - 1) x 10,000 (v0.6.0); null without a reference" }
                  quote_venue: { type: string, nullable: true, description: "Venue of the best quote that was current for this fill's tranche (v0.7.0): the latest stored quote read before the fill's block and not before the plan's previous fill, if it was read for this fill's tranche and within 60 minutes before the fill. All eight quote fields are null together when there is none (\"no quote on record\"); a later quote, another tranche's quote or an older one is never used." }
                  quote_route: { type: string, nullable: true }
                  quote_usdc: { type: string, nullable: true, description: "The tranche amount that quote was for" }
                  quote_nock_out: { type: string, nullable: true }
                  quote_effective_price_usd: { type: string, nullable: true }
                  quote_block_number: { type: integer, nullable: true, description: "Block the quote was read at. Shown beside the cost figure." }
                  quoted_at: { type: string, format: date-time, nullable: true }
                  quote_cost_bps: { type: integer, nullable: true, description: "(fill effective price / quote effective price - 1) x 10,000 (v0.7.0). The market can move between the quote's block and the fill, so this is not execution cost alone." }
        '404':
          description: Receipt not found on-chain yet (retry once the transaction lands)
        '409':
          description: No accumulation_plan is configured
        '422':
          description: Invalid hash, reverted transaction, not a USDC to NOCK purchase by the tracked wallet, or confirmed before the plan began (BEFORE_PLAN_START)
        '503':
          description: RPC unavailable; nothing recorded

  /accumulation/events:
    get:
      tags: [Execution]
      summary: List receipt-verified accumulation fills, oldest first
      operationId: listAccumulationEvents
      responses:
        '200':
          description: Fills
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        plan_id: { type: string }
                        tx_hash: { type: string }
                        venue: { type: string, nullable: true, description: "The plan's venue label when the buy was recorded; null when the plan had none (v0.8.1, issue #132)" }
                        usdc_spent: { type: string }
                        nock_received: { type: string }
                        effective_price_usd: { type: string }
                        block_number: { type: integer }
                        confirmed_at: { type: string, format: date-time }
                        reference_spot_usd: { type: string, nullable: true, description: "Stored NOCK/USD price that stands for the fill's block time (v0.6.0; own read preferred, a candle counts as its open, #129); null when none was near" }
                        reference_spot_source: { type: string, nullable: true }
                        execution_cost_bps: { type: integer, nullable: true, description: "Cost over the reference spot in basis points (v0.6.0); null without a reference" }
                        quote_venue: { type: string, nullable: true, description: "Venue of the best quote that was current for this fill's tranche (v0.7.0); the eight quote fields are null together when no quote was on record" }
                        quote_route: { type: string, nullable: true }
                        quote_usdc: { type: string, nullable: true }
                        quote_nock_out: { type: string, nullable: true }
                        quote_effective_price_usd: { type: string, nullable: true }
                        quote_block_number: { type: integer, nullable: true }
                        quoted_at: { type: string, format: date-time, nullable: true }
                        quote_cost_bps: { type: integer, nullable: true, description: "Cost over that quote in basis points (v0.7.0); not execution cost alone, since the market can move between the quote's block and the fill" }

  /accumulation/quotes/latest:
    get:
      tags: [Execution]
      summary: The route quotes the worker currently holds for the due tranche
      operationId: latestRouteQuotes
      description: |
        Route quotes for a due tranche (v0.7.0, issue #115), read from the worker's
        memory. It makes no RPC call and quotes nothing. The quotes are left out of the
        snapshot's `state_hash`, and the snapshot's ETag is that hash, so a conditional
        GET of the snapshot can answer 304 while the quotes have moved on (a later
        cycle, or a refresh). The dashboard reads them here. Answered with
        `Cache-Control: no-store`.
      responses:
        '200':
          description: The plan's status and its quotes. Every field is null when there is no snapshot or no plan; `route_quotes` is null unless a tranche is due and quoting is on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_id: { type: string, nullable: true }
                  status: { type: string, nullable: true, description: "The plan's status in the worker's latest snapshot" }
                  tranche_index: { type: integer, nullable: true }
                  tranche_usdc: { type: string, nullable: true }
                  route_quotes:
                    allOf:
                      - $ref: './snapshot.yaml#/components/schemas/RouteQuotes'
                    nullable: true

  /accumulation/quotes/refresh:
    post:
      tags: [Execution]
      summary: Quote the due tranche again at the latest block
      operationId: refreshRouteQuotes
      description: |
        Route quotes for a due tranche (v0.7.0, issue #115). Takes no body and no
        parameters: the worker quotes the tranche amount of the latest snapshot's
        `accumulation_plan`, and only while its status is `tranche_due`. It makes
        read-only quoter calls (`eth_call`), stores the result so a later fill can be
        measured against it, and attaches it to the snapshot being served. It never
        signs, builds or sends a transaction, and never quotes another amount. Costs are
        measured against the reference spot of the cycle's own quotes; when the worker
        holds none (just after a restart), `cost_over_spot_pct` is null.
        Unauthenticated, like the other endpoints of this LAN-only API; each call
        makes about a dozen RPC reads, so calls are at least 10 seconds apart (v0.8.1,
        issue #133): inside that window the answer is the quotes the worker already
        holds for the tranche (a 200, with their own block and time), or 429
        `REFRESH_COOLDOWN` with `Retry-After` when it holds none.
      responses:
        '200':
          description: The quotes. A venue that could not be quoted is `unavailable` with its reason; that is still a 200. Inside the cooldown, the quotes already held, unchanged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_id: { type: string }
                  tranche_index: { type: integer }
                  route_quotes:
                    $ref: './snapshot.yaml#/components/schemas/RouteQuotes'
        '409':
          description: NO_PLAN (no accumulation_plan is configured), QUOTES_DISABLED (route_quotes.enabled is false) or NO_TRANCHE_DUE (nothing is due, so nothing is quoted)
        '429':
          description: REFRESH_COOLDOWN. The quotes were read less than 10 seconds ago and the worker holds none to answer with; `Retry-After` gives the seconds left.
        '503':
          description: NO_SNAPSHOT. No snapshot yet, so it is not known whether a tranche is due.

  /positions/found:
    get:
      tags: [Execution]
      summary: Positions found on-chain, and the rows tracked from the database (v0.9.0)
      operationId: listFoundPositions
      description: |
        The latest snapshot's `derived_metrics.position_detection` block as it is (null
        before the first cycle), and every row of the tracked-positions table with the
        config.yaml entry that would track the same position. The entries are for a
        rollback to a release older than v0.9.0, which does not read these rows: without
        them its totals leave the positions out without saying so. It makes no chain read.
      responses:
        '200':
          description: The detection block and the tracked rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  detection: { type: object, nullable: true, additionalProperties: true }
                  tracked_rows:
                    type: array
                    items:
                      type: object
                      properties:
                        position_id: { type: string }
                        nft_id: { type: integer }
                        role: { type: string, nullable: true }
                        rung: { type: string, nullable: true }
                        source: { type: string, enum: [detected, confirmed] }
                        deposit_tx: { type: string, nullable: true }
                        tracked_at: { type: string, format: date-time, nullable: true }
                        config_entry: { type: string, description: 'The YAML entry for positions: in config.yaml' }
                  rollback_note: { type: string }
        '503':
          description: TRACKED_POSITIONS_UNAVAILABLE. The tracked positions table could not be read.

  /positions/track:
    post:
      tags: [Execution]
      summary: Track a position found on-chain, with one tap (v0.9.0)
      operationId: trackFoundPosition
      description: |
        Counts a found position from the next cycle on: as a ladder rung (`role: ladder`,
        measured and never steered, with its mint as the #167 baseline) or as LP
        (classified by its pair and counted in what LP holds; never a rebuild target).
        The NFT's owner and liquidity are read on-chain again first. It also changes how
        a position already tracked from the database is tracked (its rung, say). It
        builds no transaction, and a config.yaml entry is never changed from here. A
        cycle runs after the write; `cycle` reports it. Takes a JSON body, like every
        write, and sits behind the cross-site guard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nft_id, as]
              properties:
                nft_id: { type: integer, description: 'The Uniswap v4 position NFT, as the detection block lists it' }
                as: { type: string, description: 'ladder:near | ladder:deep | lp (one of the position''s `choices`)' }
      responses:
        '200':
          description: Tracked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [tracked] }
                  position_id: { type: string }
                  nft_id: { type: integer }
                  role: { type: string, nullable: true }
                  rung: { type: string, nullable: true }
                  deposit_tx: { type: string, nullable: true }
                  note: { type: string }
                  cycle: { type: string, description: '"ok", or why the cycle after the write failed (the write is stored)' }
        '400':
          description: UNKNOWN_CHOICE. `as` is not lp or ladder:<rung>.
        '404':
          description: NOT_FOUND. NockNock has not found this NFT arriving in the tracked wallet.
        '422':
          description: CONFIG_POSITION (config.yaml lists it), NOT_ELIGIBLE (not a whitelisted pool), CHOICE_NOT_OFFERED (not a USDC/NOCK concentrated range, or its pool is unknown), NOT_OWNED, or EMPTY. Nothing changed.
        '500':
          description: DB_ERROR. Nothing changed.
        '503':
          description: CHAIN_UNAVAILABLE, NO_RPC or NO_TRACKED_WALLET. Nothing changed.

  /positions/untrack:
    post:
      tags: [Execution]
      summary: Stop counting a position tracked from the database (v0.9.0)
      operationId: untrackPosition
      description: |
        Removes the database row and sets the NFT aside, so it is not tracked again by
        itself. The NFT stays in the wallet; it is then listed under `dismissed`, not
        counted, with its value, and can be tracked again. Database rows only: a
        config.yaml entry answers 422 CONFIG_POSITION. A cycle runs after the write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position_id]
              properties:
                position_id: { type: string, description: 'e.g. uniswap-v4:base:3243807' }
      responses:
        '200':
          description: Untracked
        '404':
          description: NOT_TRACKED. Not a position tracked from the chain.
        '422':
          description: CONFIG_POSITION. A config.yaml entry is removed by editing that file.
        '500':
          description: DB_ERROR. Nothing changed.

  /positions/dismiss:
    post:
      tags: [Execution]
      summary: Set a found position aside (NOT NOW) (v0.9.0)
      operationId: dismissFoundPosition
      description: |
        Moves a found position from `found_not_counted` to `dismissed`. Neither is
        counted; a dismissed one is not tracked by itself even when it matches a rung.
        Idempotent. The snapshot's lists update on the next ingestion cycle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nft_id]
              properties:
                nft_id: { type: integer }
      responses:
        '200':
          description: Dismissed (`changed` is false when it already was)
        '404':
          description: NOT_FOUND
        '409':
          description: TRACKED (untrack it instead) or NOT_AN_OFFER (dust, a hooked pool, a burned NFT)
        '500':
          description: DB_ERROR. Nothing changed.

  /positions/restore:
    post:
      tags: [Execution]
      summary: Put a set-aside position back on offer (v0.9.0)
      operationId: restoreFoundPosition
      description: |
        Moves a position from `dismissed` back to `found_not_counted`. It is still not
        counted until it is tracked. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nft_id]
              properties:
                nft_id: { type: integer }
      responses:
        '200':
          description: Offered again (`changed` is false when it already was)
        '404':
          description: NOT_FOUND
        '409':
          description: TRACKED or NOT_AN_OFFER
        '500':
          description: DB_ERROR. Nothing changed.

  /accumulation/candidates:
    get:
      tags: [Execution]
      summary: List every transaction fill detection has examined (v0.6.0)
      operationId: listAccumulationCandidates
      description: |
        Transactions that sent NOCK to the tracked wallet and were checked against
        their receipt, newest first, with the verdict. `offered` and `dismissed` are
        USDC to NOCK purchases by the wallet; `not_a_purchase` is anything else (a fee
        claim, a liquidity deposit, a sale). A candidate is never plan progress.
      responses:
        '200':
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        tx_hash: { type: string }
                        state: { type: string, enum: [offered, dismissed, not_a_purchase] }
                        reason: { type: string, nullable: true, description: "Rejection code for not_a_purchase" }
                        recorded: { type: boolean, description: "True when the hash is in the accumulation ledger" }
                        block_number: { type: integer, nullable: true }
                        confirmed_at: { type: string, format: date-time, nullable: true }
                        usdc_spent: { type: string, nullable: true }
                        nock_received: { type: string, nullable: true }
                        effective_price_usd: { type: string, nullable: true }
                        reference_spot_usd: { type: string, nullable: true }
                        reference_spot_source: { type: string, nullable: true }
                        execution_cost_bps: { type: integer, nullable: true }
                        first_seen_at: { type: string, format: date-time, nullable: true }
        '500':
          description: The candidates table could not be read

  /accumulation/candidates/dismiss:
    post:
      tags: [Execution]
      summary: Mark a detected swap "not part of the plan" (v0.6.0)
      operationId: dismissAccumulationCandidate
      description: |
        Moves a detected swap from `offered` to `dismissed`. It is not written to the
        ledger and does not advance the plan; it stays listed and can be restored.
        Idempotent. Touches only the candidates table. Unauthenticated, like the other
        routes. The snapshot's offer list updates on the next ingestion cycle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateActionRequest'
      responses:
        '200':
          description: The swap is dismissed (changed is false when it already was)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateActionResponse'
        '404':
          description: CANDIDATE_NOT_FOUND. The transaction was never detected; nothing to dismiss.
        '409':
          description: ALREADY_RECORDED (the buy is in the ledger) or NOT_AN_OFFER (checked, and not a purchase)
        '422':
          description: INVALID_TX_HASH
        '500':
          description: The candidates table could not be read or updated; nothing changed
        '503':
          description: NO_TRACKED_WALLET. No tracked wallet is configured, so there are no candidates to act on; nothing changed.

  /accumulation/candidates/restore:
    post:
      tags: [Execution]
      summary: Put a dismissed swap back on offer (v0.6.0)
      operationId: restoreAccumulationCandidate
      description: |
        Moves a swap from `dismissed` back to `offered`. It is still not counted until
        the operator confirms it through /execute/record-accumulation. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateActionRequest'
      responses:
        '200':
          description: The swap is on offer (changed is false when it already was)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateActionResponse'
        '404':
          description: CANDIDATE_NOT_FOUND
        '409':
          description: ALREADY_RECORDED or NOT_AN_OFFER
        '422':
          description: INVALID_TX_HASH
        '500':
          description: The candidates table could not be read or updated; nothing changed
        '503':
          description: NO_TRACKED_WALLET. No tracked wallet is configured; nothing changed.

  /cost-basis/series:
    get:
      tags: [Execution]
      summary: Average cost against spot over time (v0.6.0)
      operationId: getCostBasisSeries
      description: |
        The data behind the "Average cost vs spot" chart (issue #98). Every
        receipt-verified fill, oldest first, with the average cost as it stood once that
        fill was confirmed, and the stored NOCK/USD spot over the range.

        Nothing is interpolated. `spot` holds stored observations only, thinned to at
        most one per `bucket_seconds` (the last stored row in each bucket, with its own
        timestamp and price); a bucket with no observation has no point, and clients
        must draw that as a gap. `spot_at_fill` is the stored price that stands for the
        fill's block time: among the stored points within `spot_match_window_minutes`
        of it, the worker's own read nearest the fill, or, when there is none, the
        nearest backfilled point; null when no point lies within the window. Every
        point is the price at its own `at` (see `CostBasisSpotPoint`).
        The averages are exact between fills: an average cost changes only when a buy
        is recorded.
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 365 }
          description: |
            Range ending now. Default: back to the earlier of the first fill and the
            opening basis plus a day, at least 2 and at most 365; 30 when there is
            neither.
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema:
                type: object
                required: [generated_at, from, to, bucket_seconds, spot_match_window_minutes, fills, whole_stack]
                properties:
                  generated_at: { type: string, format: date-time }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  bucket_seconds:
                    type: integer
                    description: Width of the thinning bucket; two spot points further apart than a few buckets have a gap between them
                  spot_match_window_minutes: { type: integer }
                  spot:
                    type: array
                    nullable: true
                    description: Stored spot observations in range, oldest first; null when the price history could not be read (see spot_error)
                    items:
                      $ref: '#/components/schemas/CostBasisSpotPoint'
                  spot_error:
                    type: string
                    nullable: true
                  fills:
                    type: array
                    description: Every verified fill in the ledger (not only those in range), oldest first
                    items:
                      type: object
                      required: [plan_id, tx_hash, block_number, confirmed_at, usdc_spent, nock_received, effective_price_usd, plan_avg_cost_usd, avg_cost_usd]
                      properties:
                        plan_id: { type: string }
                        tx_hash: { type: string }
                        block_number: { type: integer }
                        confirmed_at: { type: string, format: date-time }
                        usdc_spent: { type: string }
                        nock_received: { type: string }
                        effective_price_usd: { type: string }
                        plan_avg_cost_usd:
                          type: string
                          description: Running average inside this fill's own plan, after this fill
                        avg_cost_usd:
                          type: string
                          description: Running average across every plan in the ledger, after this fill
                        whole_stack_avg_cost_usd:
                          type: string
                          nullable: true
                          description: Blended average after this fill; null without a valid opening basis, or for a fill at or before its as_of
                        spot_at_fill:
                          allOf:
                            - $ref: '#/components/schemas/CostBasisSpotPoint'
                          nullable: true
                  whole_stack:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [not_configured, ok, invalid]
                      reason: { type: string, nullable: true }
                      opening:
                        type: object
                        nullable: true
                        description: The operator-entered opening basis, where the blended line starts
                        properties:
                          as_of: { type: string, format: date-time }
                          nock: { type: string }
                          cost_usd: { type: string }
                          avg_cost_usd: { type: string }
                          source: { type: string }
        '400':
          description: days is not a whole number from 1 to 365
        '503':
          description: The accumulation ledger could not be read (LEDGER_UNAVAILABLE); no series is returned

  /simulate/ladder:
    get:
      tags: [Snapshots]
      summary: Ladder simulator, a read-only what-if (v0.9.0, issue #166)
      operationId: simulateLadder
      description: |
        A USDC/NOCK range that is mostly USDC and sits below spot (a "ladder"), worked
        out from the latest stored snapshot alone (memory, then the database, as
        /snapshot/latest): no RPC read, no ingestion cycle, nothing signed or sent, and
        no amount chosen by NockNock. A GET, so the cross-site write guard (#133) lets
        it through; the route has no write method.

        Every pool moves by the same percentage as spot, each from its own current
        price, so grid row 0 is the snapshot. Gas-side ranges with no NOCK leg are left
        out. The reserve gate is the stable balance (wallet USDC less the ladder's, plus
        the ladder's and the existing NOCK ranges' USDC) at the ladder's own bottom,
        against GlobalStatus.cash_reserve_usdc; the reading below the bottom (the
        existing ranges keep converting) and the reading at the top are separate
        measured fields, and the accumulation plan's unspent budget and the tax reserve
        are stated, not gates. The NOCK gate is GlobalStatus.lp_nock_budget itself; the
        rebuild's suggestions are a separate line. The effect on the floor-crossing
        price is floor_breach recomputed with the ladder added and its NOCK taken from
        the wallet.

        Snapping: to the tick spacing of the tracked position named by position_id, or
        to a tick_spacing the caller states; never one taken from a fee tier. A numeric
        bound goes to the nearest usable tick; high=spot to the usable tick at or below
        the pool price in USD terms (it holds no NOCK), and both ticks next to spot are
        listed with their NOCK need. With neither, the range is unsnapped and says so.
        Percent bounds and high=spot are relative to the ladder pool's own price (spot,
        unless position_id names another pool).

        Since 2.10.0 (extending #166), additive; a one-rung body is unchanged apart from
        `fee_estimate` and, only when operator_profile.ladder_bottom_usd is set, the gate
        fields:
        - A ladder of rungs: the indexed parameters r1_..r4_ (rN_rung cap | near | deep,
          required; rN_usdc; rN_low | rN_low_pct; rN_high | rN_high=spot | rN_high_pct;
          optional rN_nock) instead of the flat ones, all in one pool. Mixing the two
          forms, an index gap, a missing role or a fifth rung is a 400 (LADDER_MAX_RUNGS
          = 4, a display limit, echoed in combined.max_rungs). Overlapping rungs are
          allowed and listed in combined.overlaps. One reserve gate and one NOCK budget
          are shared: the gate is read where every rung is fully NOCK, at the lower of
          the deepest rung's bottom and GlobalStatus.ladder_bottom_usd (without it, the
          deepest bottom, stated in gate_price_rule); the NOCK budget is met by the sum.
          The floor-crossing effect adds every rung as a hypothetical position.
        - shape=configured: the operator's own operator_profile.ladder_rungs
          (GlobalStatus.ladder_rungs), sized to shape_usdc or to the shared reserve
          gate's most (max_usdc_total). A cap, when the shape starts with one, is the
          tick band containing the pool's tick, holding the LP NOCK budget and the USDC
          its curve pairs with it, never more USDC than the near rung's.
        - fee_estimate: fees per day while in range, measured from our own tracked
          range (snapshot derived_metrics.fee_yield), the measuring range's average fee
          per unit of liquidity times the range's liquidity, valued at the current pool
          price; always beside the in-range share of stored history and the replay upper
          bounds, with the measurement inside the range (band_measured), the daily spread
          over UTC days and the assumptions. Null with a reason when it cannot be stated.
        - tradeoff (two or more rungs): measurement tables (split, near rung's depth,
          deep rung's top) in the order of the quantity varied, never ranked, none marked.
      parameters:
        - { name: usdc, in: query, required: false, schema: { type: number, exclusiveMinimum: true, minimum: 0 }, description: 'One-rung form (required there): USDC the ladder holds at spot' }
        - { name: nock, in: query, required: false, schema: { type: number, minimum: 0 }, description: NOCK to check against what the range needs (within the larger of 1 NOCK and 10 bps) }
        - { name: low, in: query, required: false, schema: { type: number, exclusiveMinimum: true, minimum: 0 }, description: Bottom in USD per NOCK; exactly one of low and low_pct }
        - { name: low_pct, in: query, required: false, schema: { type: number, exclusiveMinimum: true, minimum: -100 }, description: Bottom as percent of the pool price }
        - { name: high, in: query, required: false, schema: { type: string }, description: 'Top in USD per NOCK, or the word "spot"; exactly one of high and high_pct' }
        - { name: high_pct, in: query, required: false, schema: { type: number, exclusiveMinimum: true, minimum: -100 }, description: Top as percent of the pool price }
        - { name: position_id, in: query, required: false, schema: { type: string }, description: A tracked USDC/NOCK concentrated position whose pool and tick spacing the ladder uses }
        - { name: tick_spacing, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 32767 }, description: A spacing the caller states, instead of position_id }
        - { name: grid_to_pct, in: query, required: false, schema: { type: number, minimum: -95, maximum: -1, default: -40 } }
        - { name: grid_step_pct, in: query, required: false, schema: { type: number, minimum: 0.5, maximum: 20, default: 5 }, description: At most 60 rows }
        - { name: r1_rung, in: query, required: false, schema: { type: string, enum: [cap, near, deep] }, description: 'A ladder of rungs: rung 1''s role, required for it, never assumed (r2_..r4_ likewise)' }
        - { name: r1_usdc, in: query, required: false, schema: { type: number, exclusiveMinimum: true, minimum: 0 }, description: Rung 1's USDC at spot }
        - { name: r1_nock, in: query, required: false, schema: { type: number, minimum: 0 }, description: Rung 1's NOCK, checked as nock is }
        - { name: r1_low, in: query, required: false, schema: { type: number, exclusiveMinimum: true, minimum: 0 }, description: Rung 1's bottom in USD per NOCK; or r1_low_pct }
        - { name: r1_low_pct, in: query, required: false, schema: { type: number } }
        - { name: r1_high, in: query, required: false, schema: { type: string }, description: 'Rung 1''s top in USD per NOCK, or "spot"; or r1_high_pct' }
        - { name: r1_high_pct, in: query, required: false, schema: { type: number } }
        - { name: split_step_pct, in: query, required: false, schema: { type: number, minimum: 5, maximum: 50, default: 10 }, description: 'Rungs only: the split table''s step, a display step, echoed' }
        - { name: shape, in: query, required: false, schema: { type: string, enum: [configured] }, description: 'operator_profile.ladder_rungs, instead of the flat or indexed rungs' }
        - { name: shape_usdc, in: query, required: false, schema: { type: number, exclusiveMinimum: true, minimum: 0 }, description: 'With shape: the total to size it to (default: the shared reserve gate''s most)' }
      responses:
        '200':
          description: The simulation. Amounts are strings; a figure that cannot be stated is null with a stated reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LadderSimulation'
        '400':
          description: INVALID_PARAMETER (an unknown parameter, a missing or non-finite number, low >= high, both low and low_pct, a closed or untracked position_id, flat and indexed parameters mixed, an index gap, a rung with no role, a fifth rung, split_step_pct out of range or on the one-rung form, shape with other rungs, ...)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LadderError' }
        '422':
          description: LADDER_NOT_SIMULATED; `code` is NOCK_TOO_LITTLE, NOCK_TOO_MUCH, USDC_EXCEEDS_WALLET, RANGE_ABOVE_SPOT, RANGE_TOO_NARROW, RANGE_OUTSIDE_TICKS (an unsnapped bound past MIN_TICK or MAX_TICK, a range that cannot exist), POOL_NOT_SNAPPABLE or SPOT_UNAVAILABLE; for rungs also RUNG_TOO_NARROW and RUNGS_EXCEED_WALLET (a rung's own error names it first, as r2 (deep)); for shape=configured SHAPE_NOT_CONFIGURED (none set, or the configuration error named), SHAPE_TOTAL_UNKNOWN (no reserve to size by, so give shape_usdc), SHAPE_NO_ROOM and SHAPE_NEEDS_TICK_SPACING (a cap needs position_id). A NOCK mismatch carries nock_needed (a measured figure) and the bounds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LadderError' }
        '503':
          description: NO_SNAPSHOT, with the last ingestion error as detail

  /execute/record-harvest:
    post:
      tags: [Execution]
      summary: Record a receipt-verified fee harvest in the ledger
      operationId: recordHarvest
      description: |
        Called by clients after the paired wallet confirms a claim transaction.
        The worker fetches the Base transaction receipt, verifies success, and
        extracts the ERC-20 Transfer logs (USDC, NOCK, WETH, and since v0.6.0 AERO)
        paid to the sovereign wallet, plus ETH unwrapped by a Uniswap position manager.
        AERO (#93) is what an Aero gauge pays on a claim: a Transfer of
        0x3f5bF3EdAc59d650D8fDf9657a71F2f904A3a4Ee to the wallet, minted from the zero
        address. It is valued from the AERO price pool read at the claim's block; when
        that read fails or the pool had no in-range liquidity at that block the row has
        no usd_value, never a substitute. Record an AERO claim with the platform of the
        position it came from (aerodrome or aerodrome-cl). NockNock builds no AERO claim
        transaction and gives no advice to claim.
        The ledger holds one row per (transaction, token). Several Transfers of one
        token to the wallet in the transaction (a claim from two gauges mints AERO
        twice) are summed into that one row.
        Recording a transaction again never duplicates or changes a valued row. If a
        row was recorded without a usd_value because the price read at the claim's
        block failed, recording the same transaction again fills it from that block's
        price; such rows are returned in `priced`.
        Only a claim is recorded (#157). A fee or reward claim only pays the wallet: a
        transaction in which the wallet pays out an ERC-20 (a 3-topic Transfer from the
        wallet), or which sends ETH, is a swap, deposit or purchase, and is refused with
        422 NOT_A_CLAIM. A position NFT leaving the wallet (an ERC-721 Transfer, burned
        on withdrawal or staked) does not count. A NOCK buy is recorded with
        /execute/record-accumulation.
        Principal is not income (#156). A transaction that removes liquidity and
        collects in one step pays back the position's principal with its fees. For each
        DecreaseLiquidity emitted by the Uniswap v3 NPM or the Aero CL position manager,
        the position's token0/token1 are read from positions(tokenId) at the block
        before the transaction, and the decrease's amounts are taken out of what the
        wallet received (WETH principal from the WETH row first, then from ETH unwrapped
        by a position manager). Only the remainder is booked; the principal left out is
        returned in `principal_excluded`. Principal that cannot be read from the receipt
        is refused with nothing recorded (422 PRINCIPAL_NOT_SEPARABLE): a Uniswap v4
        liquidity removal (negative ModifyLiquidity; the event has no amounts), an Aero
        basic or v2-style pool Burn, a concentrated pool Burn for an owner that is not
        one of those position managers, a decrease whose principal is not collected in
        the same transaction to the wallet, the position manager or the contract the
        wallet called, or a collect from a position that held no liquidity just before
        the transaction (its payout is principal decreased earlier). Principal larger
        than what the wallet received of that token is refused (422
        PRINCIPAL_EXCEEDS_INFLOW); this includes principal in a token NockNock does not
        book, unless the receipt shows the wallet receiving it. A transaction that only
        returns principal records nothing (422 PRINCIPAL_ONLY). Known limit: part of a
        position's liquidity decreased in one transaction and collected in a later one,
        while the position still holds liquidity, is booked in full by the later one;
        the Uniswap and Aero apps decrease and collect in one transaction.
        Nothing is recorded without on-chain verification. A 404 RECEIPT_NOT_FOUND
        also covers the Uniswap-app pending-broadcast quirk (approved but not yet
        broadcast): surface "approved, awaiting wallet broadcast" and retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, tx_hash]
              properties:
                platform:
                  type: string
                  enum: [aerodrome, aerodrome-cl, uniswap-v4, uniswap-v3]
                  description: The venue the claim was made on; the same values as a position's protocol. aerodrome-cl is an Aero concentrated-liquidity position (v0.6.0).
                tx_hash:
                  type: string
                  description: 32-byte hex transaction hash (0x-prefixed or bare)
      responses:
        '200':
          description: Ledger rows recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded:
                    type: array
                    items:
                      type: object
                      properties:
                        platform: { type: string }
                        tx_hash: { type: string }
                        token_symbol: { type: string }
                        amount_human: { type: string }
                        usd_value: { type: string, nullable: true }
                        block_number: { type: integer }
                  already_present:
                    type: integer
                  priced:
                    type: array
                    description: >
                      Rows that were already in the ledger with no usd_value and were
                      given one by this call (same transaction, token and amount;
                      valued at the claim's block). Empty in the usual case. (v0.6.0)
                    items:
                      type: object
                      properties:
                        platform: { type: string }
                        tx_hash: { type: string }
                        token_symbol: { type: string }
                        amount_human: { type: string }
                        usd_value: { type: string }
                        block_number: { type: integer }
                  principal_excluded:
                    type: array
                    description: >
                      Liquidity the transaction returned, left out of the ledger: one
                      entry per ledger row it was taken from. Empty for an ordinary fee
                      claim. (#156)
                    items:
                      type: object
                      properties:
                        token_symbol: { type: string }
                        token_address: { type: string }
                        amount_human: { type: string }
        '404':
          description: Receipt not found on-chain (may be pending broadcast in the wallet)
        '409':
          description: Transfers already recorded and nothing to fill in (idempotent retry)
        '422':
          description: >
            Invalid platform/hash, reverted transaction, or no tracked transfers; or
            a transaction that is not a claim (NOT_A_CLAIM, #157); or
            principal that cannot be split from fees (PRINCIPAL_NOT_SEPARABLE,
            PRINCIPAL_EXCEEDS_INFLOW), or a transaction that only returns principal
            (PRINCIPAL_ONLY). Nothing is recorded.
        '503':
          description: >
            No RPC key configured; the receipt or the transaction could not be read
            (RPC_UNAVAILABLE); or a position the transaction touches could not be read
            (POSITION_UNREADABLE). Nothing is recorded.

  /tax/export:
    get:
      tags: [Execution]
      summary: Koinly-compatible tax export of the harvest ledger
      operationId: exportTax
      description: |
        Exports the receipt-verified harvest ledger. Fee claims are tagged
        `income` and carry their Base tx hash; every row ties out to on-chain
        receipts. An AERO row (v0.6.0, #93) is described as "NockNock AERO reward
        claim (<platform>)" instead of "NockNock fee harvest (<platform>)"; its label
        stays `income`. Rebalances/liquidity transfers are not yet ledgered (future
        work — they will export with a non-taxable `transfer` label).
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [koinly, csv, json]
            default: koinly
      responses:
        '200':
          description: Export payload (CSV attachment or JSON)
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
        '500':
          description: Ledger query failed
        '422':
          description: Unsupported format requested

  /notifications/status:
    get:
      tags: [Notifications]
      summary: Which notification channels are configured (v0.6.0)
      operationId: getNotificationStatus
      description: |
        States which of Telegram, Pushover and the webhook are configured, and when the
        worker notifies. Reads config only: nothing is sent. The response never carries a
        token, a user key or the webhook URL.
      responses:
        '200':
          description: Channel readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatus'

  /notifications/test:
    post:
      tags: [Notifications]
      summary: Send one TEST notification through the configured channels (v0.6.0)
      operationId: sendTestNotification
      description: |
        Sends one message, labelled TEST in its first line, through every configured
        channel and reports each channel's outcome. `delivered` means the provider
        accepted the message, not that a phone displayed it. With no channel configured
        it answers 200 with `sent: false` and sends nothing. No request body. There is
        no authentication beyond reaching the worker on the LAN; test sends are limited
        to one per `test_cooldown_seconds`.
      responses:
        '200':
          description: Per-channel outcome (also when nothing is configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTestResult'
        '429':
          description: A test was sent less than the cooldown ago (error RATE_LIMITED, with retry_after_seconds)

components:
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag (state_hash) from previous request for conditional GET
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    SnapshotId:
      name: snapshot_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Maximum number of snapshots to return
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Before:
      name: before
      in: query
      description: Return snapshots before this timestamp (exclusive)
      schema:
        type: string
        format: date-time
    After:
      name: after
      in: query
      description: Return snapshots after this timestamp (inclusive)
      schema:
        type: string
        format: date-time

  schemas:
    # Re-use the envelope and meta from snapshot.yaml
    SnapshotEnvelope:
      $ref: './snapshot.yaml#/components/schemas/SnapshotEnvelope'
    SnapshotMeta:
      $ref: './snapshot.yaml#/components/schemas/SnapshotMeta'
    SnapshotData:
      $ref: './snapshot.yaml#/components/schemas/SnapshotData'

    HealthResponse:
      type: object
      required: [status, last_sync, ingestion_lag_seconds]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        last_sync:
          type: string
          format: date-time
          description: When ingestion last successfully completed
        ingestion_lag_seconds:
          type: integer
          description: Seconds since last successful ingestion run
        sync_duration_ms:
          type: integer
          description: Measured duration in milliseconds of the most recent sync cycle
        sync_window_seconds:
          type: integer
          description: Configured sync window interval in seconds
        errors:
          type: array
          items:
            type: string
          description: Recent error messages (if degraded/down)

    CostBasisSpotPoint:
      type: object
      description: |
        One stored NOCK/USD point from the price history (v0.6.0): the price at `at`.
        Never interpolated. The worker's own read is stamped when it was taken. A
        third-party candle is stored at its open time, so its point here is the candle's
        OPEN (the price at that instant); the candle's close, which is the price one
        candle period later, is never placed at the open time. A candle without a usable
        open yields no point.
      required: [at, price_usd, source, is_backfilled]
      properties:
        at: { type: string, format: date-time }
        price_usd:
          type: string
          description: The price at `at` (a candle's open, or the observation itself)
        source:
          type: string
          description: Provenance of the row (the worker's own pool read, or a third-party feed)
        is_backfilled:
          type: boolean
          description: True for a third-party point filled in after the fact (a candle, shown at its open), false for the worker's own contemporaneous read

    HistoricalResponse:
      type: object
      required: [snapshots, pagination]
      properties:
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotEnvelope'
        pagination:
          $ref: '#/components/schemas/Pagination'

    MetadataResponse:
      type: object
      required: [snapshots]
      properties:
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotMetadataEntry'

    SnapshotMetadataEntry:
      type: object
      required: [snapshot_id, generated_at, state_hash, age_seconds]
      properties:
        snapshot_id:
          type: string
          format: uuid
        generated_at:
          type: string
          format: date-time
        state_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        age_seconds:
          type: integer
          description: Seconds since this snapshot was generated

    Pagination:
      type: object
      required: [limit, returned, has_more]
      properties:
        limit:
          type: integer
        returned:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
          description: Cursor for next page (opaque)

    ErrorResponse:
      type: object
      required: [error, message, timestamp]
      properties:
        error:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "Snapshot 01ARZ3NDEKTSV4RRFFQ69G5FAV not found"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-09T17:23:29.123Z"
        details:
          type: object
          nullable: true

    CandidateActionRequest:
      type: object
      description: Names a detected swap by its transaction hash (v0.6.0).
      required: [tx_hash]
      properties:
        tx_hash:
          type: string
          description: 32-byte hex transaction hash (0x-prefixed or bare)

    CandidateActionResponse:
      type: object
      description: Result of dismissing or restoring a detected swap (v0.6.0). The plan ledger is never touched.
      properties:
        tx_hash: { type: string }
        state: { type: string, enum: [offered, dismissed] }
        changed: { type: boolean, description: "False when the swap was already in that state" }
        note: { type: string }

    LadderError:
      type: object
      required: [error, detail]
      properties:
        error: { type: string, enum: [INVALID_PARAMETER, LADDER_NOT_SIMULATED] }
        code:
          type: string
          enum: [NOCK_TOO_LITTLE, NOCK_TOO_MUCH, USDC_EXCEEDS_WALLET, RANGE_ABOVE_SPOT, RANGE_TOO_NARROW, RANGE_OUTSIDE_TICKS, POOL_NOT_SNAPPABLE, SPOT_UNAVAILABLE, RUNG_TOO_NARROW, RUNGS_EXCEED_WALLET, SHAPE_NOT_CONFIGURED, SHAPE_TOTAL_UNKNOWN, SHAPE_NO_ROOM, SHAPE_NEEDS_TICK_SPACING]
        detail: { type: string }
        nock_needed: { type: string, description: NOCK the range needs at the pool price for this USDC, 4 dp }
        bounds: { $ref: '#/components/schemas/LadderBounds' }

    LadderBounds:
      type: object
      properties:
        low_usd: { type: string }
        high_usd: { type: string }
        low_pct: { type: string, description: Percent of the pool price, signed }
        high_pct: { type: string }
        tick_lower: { type: integer, nullable: true, description: Null when unsnapped }
        tick_upper: { type: integer, nullable: true }
        high_rule: { type: string, description: 'the nearest usable tick | the usable tick at or below the pool price (high = spot) | unsnapped | the tick band containing the pool''s tick (the cap) | per rung' }
        describes: { type: string, description: 'Rungs only: what the top-level figures sum over' }

    LadderGridRow:
      type: object
      properties:
        price_usd: { type: string, description: Spot moved by this row's percentage }
        pool_price_usd: { type: string, description: The ladder pool's price moved by the same percentage }
        pct_of_spot: { type: string }
        ladder_nock: { type: string }
        ladder_nock_acquired: { type: string, description: ladder_nock less the NOCK it holds at spot; negative above spot (sold) }
        ladder_usdc: { type: string }
        existing_nock_lp_usdc: { type: string, nullable: true }
        existing_nock_lp_nock: { type: string, nullable: true }
        stable_usdc: { type: string, nullable: true, description: Wallet USDC less the ladder's, plus the ladder's and the existing NOCK ranges' USDC }
        reserve_headroom_usdc: { type: string, nullable: true, description: Null with no valid reserve }
        total_tracked_nock: { type: string, nullable: true, description: Wallet NOCK less the ladder's, plus the ladder's, the existing ranges' and uncollected NOCK fees }
        markers: { type: array, items: { type: string }, description: 'spot, top, bottom; for rungs "rN top", "rN bottom" and gate' }
        rungs: { type: array, description: 'Rungs only: each rung''s USDC and NOCK at this price and whether the price is inside it (tickLower <= tick < tickUpper)', items: { type: object } }
        rungs_in_range: { type: array, items: { type: integer }, description: Rungs only }
        est_fee_usd_per_day: { type: string, nullable: true, description: 'Rungs only: the summed fee per day of the rungs in range here (est_fee_reason when null or partial)' }
        est_fee_usd_per_day_diluted: { type: string, nullable: true }
        est_fee_reason: { type: string, nullable: true }

    LadderSimulation:
      type: object
      required: [snapshot, inputs, pool, bounds, sizing, grid, bottom, top, reserve_check, floor_check, assumptions, statement]
      properties:
        snapshot:
          type: object
          description: The stored snapshot it was worked from, its age and the worker's health
          properties:
            snapshot_id: { type: string }
            generated_at: { type: string, format: date-time }
            version: { type: string }
            age_seconds: { type: integer }
            age_minutes: { type: integer }
            worker_health: { type: string, enum: [ok, degraded, starting] }
            spot_usd: { type: string, description: From the price-source pool's sqrtPriceX96, 8 dp }
            spot_source: { type: string }
        inputs: { type: object, description: The inputs as given, with the grid depth and step used }
        pool:
          type: object
          properties:
            position_id: { type: string, nullable: true }
            label: { type: string }
            pool_price_usd: { type: string }
            pool_price_vs_spot_pct: { type: string }
            tick_spacing: { type: integer, nullable: true }
            spacing_source: { type: string, nullable: true, enum: [position, caller] }
            snapped: { type: boolean }
            note: { type: string }
        bounds: { $ref: '#/components/schemas/LadderBounds' }
        top_neighbours:
          type: array
          nullable: true
          description: The usable tick at or below the pool price and the one above it, each with the NOCK this USDC would need with that top; null when unsnapped (top_neighbours_reason)
          items:
            type: object
            properties:
              tick: { type: integer }
              price_usd: { type: string }
              pct_of_spot: { type: string }
              nock_needed: { type: string, nullable: true }
              fits_budget: { type: boolean, nullable: true }
              selected: { type: boolean }
        top_neighbours_reason: { type: string, nullable: true }
        sizing:
          type: object
          properties:
            liquidity_raw: { type: string, nullable: true, description: 'Null for a ladder of rungs: liquidity is per rung (rungs[].sizing, rungs[].mint)' }
            liquidity_human: { type: string, nullable: true }
            usdc_at_spot: { type: string }
            nock_needed_at_spot: { type: string }
            nock_given: { type: string, nullable: true }
            nock_check: { type: string, enum: [not_given, matches, per_rung] }
            describes: { type: string, description: Rungs only }
        grid: { type: array, items: { $ref: '#/components/schemas/LadderGridRow' } }
        bottom:
          type: object
          properties:
            price_usd: { type: string }
            pct_of_spot: { type: string }
            nock_held: { type: string }
            nock_bought: { type: string }
            avg_buy_price_usd: { type: string, nullable: true, description: 'usdc / nock_bought: the geometric mean sqrt(low x min(pool price, high))' }
        top:
          type: object
          properties:
            price_usd: { type: string }
            pct_of_spot: { type: string }
            multiple_of_spot: { type: string }
            usdc_held: { type: string }
            out_of_range_above_now: { type: boolean }
            avg_sell_price_usd: { type: string, nullable: true }
        reserve_check:
          type: object
          properties:
            status: { type: string, enum: [holds, breached, not_configured, invalid, unknown] }
            gate: { type: string }
            cash_reserve_usdc: { type: string, nullable: true }
            stable_at_spot_usdc: { type: string, nullable: true }
            headroom_at_spot_usdc: { type: string, nullable: true }
            existing_ranges_usdc_at_bottom: { type: string, nullable: true }
            stable_at_bottom_usdc: { type: string, nullable: true }
            margin_usdc: { type: string, nullable: true }
            max_usdc_for_this_range: { type: string, nullable: true, description: The most USDC this range takes with the stable balance at its bottom still at the reserve (whole cents, at most wallet USDC) }
            at_top: { type: object, description: 'Out of range above: the ladder is all USDC (read at spot when the top is at or below it)' }
            existing_ranges_below_bottom: { type: object, nullable: true, description: The grid's lowest row below the bottom; a measurement, not the gate }
            existing_ranges_below_bottom_reason: { type: string, nullable: true }
            accumulation_plan_unspent: { type: object, nullable: true, description: Stated, not a gate }
            accumulation_plan_unspent_reason: { type: string, nullable: true }
            existing_ladders: { type: array, items: { type: string }, description: 'Tracked ladders (#167) among the existing NOCK ranges, by position_id; absent when none is tracked' }
            gate_price_usd: { type: string, description: 'Where the gate is read (2.10.0): always for rungs; for one rung only when ladder_bottom_usd is set' }
            gate_price_rule: { type: string }
            tax_reserve_usd: { type: object, nullable: true, description: Stated, not a gate }
            reason: { type: string, nullable: true }
        floor_check:
          type: object
          properties:
            status: { type: string, enum: [fits, exceeds, unknown] }
            lp_nock_budget: { type: string, nullable: true, description: Signed }
            budget_note: { type: string, nullable: true }
            nock_needed: { type: string }
            rebuild_suggested_nock: { type: string }
            rebuild_note: { type: string }
            max_usdc_within_budget: { type: string, nullable: true }
            nock_needed_by_rung: { type: array, items: { type: object }, description: Rungs only }
            floor_breach_effect:
              type: object
              properties:
                status: { type: string, enum: [none, lowers, raises, unchanged, changes, no_floor, unknown] }
                before: { type: object, nullable: true, description: "floor_breach status, crossing, tolerated, reason and nock_now (tracked NOCK at spot; equal before and after: the ladder's NOCK moves from the wallet into the range)" }
                after: { type: object, nullable: true }
                reason: { type: string }
                assumption: { type: string, nullable: true }
            reason: { type: string, nullable: true }
        fee_estimate:
          allOf: [{ $ref: '#/components/schemas/LadderFeeEstimate' }]
          nullable: true
          description: One rung only; for rungs it is null and each rung carries its own (fee_estimate_reason)
        fee_estimate_reason: { type: string, description: Rungs only }
        rungs: { type: array, items: { $ref: '#/components/schemas/LadderRung' }, description: Rungs and shape=configured only }
        combined: { $ref: '#/components/schemas/LadderCombined' }
        tradeoff: { allOf: [{ $ref: '#/components/schemas/LadderTradeoff' }], nullable: true }
        tradeoff_reason: { type: string, nullable: true }
        shape_status:
          type: string
          enum: [computed, deployed, price_at_or_below_bottom]
          description: >
            shape=configured only. computed: something is left to deposit (the body
            simulates those remainders). deployed or price_at_or_below_bottom: nothing is
            left to deposit; the body then carries only snapshot, inputs (with the plan in
            inputs.shape.plan), pool, shape_status and statement.
        assumptions: { type: array, items: { type: string } }
        statement: { type: string }

    LadderFeeEstimate:
      type: object
      description: |
        Fees per day while in range (2.10.0), measured from our own tracked range: the
        measuring range's average fee per unit of liquidity (derived_metrics.fee_yield)
        times this range's liquidity, the NOCK leg valued at the current pool price. Fee
        intensity per unit of liquidity is taken as uniform across the measuring range's
        ticks (assumptions[0]); band_measured is the measurement inside the range. The
        in-range share and the replay always stand beside it: a high rate while in range
        is not a rate per day. Replay figures are upper bounds. Null fields carry a reason.
      properties:
        status: { type: string, enum: [measured, unavailable] }
        reason: { type: string, nullable: true }
        measured_by: { type: string, nullable: true }
        measured_label: { type: string, nullable: true }
        measured_at: { type: string, nullable: true, description: fee_yield.computed_at }
        measurement_age_seconds: { type: integer, nullable: true }
        measured_seconds: { type: number, nullable: true }
        measured_days: { type: string, nullable: true }
        intervals: { type: integer, nullable: true }
        skipped: { type: object, nullable: true }
        skipped_seconds: { type: object, nullable: true }
        rate: { type: object, nullable: true, description: 'usdc_per_liquidity_day, nock_per_liquidity_day, usd_per_1e15_liquidity_day and the pool price it is valued at' }
        per_day_in_range_usd: { type: string, nullable: true }
        per_day_in_range_usdc_leg: { type: string, nullable: true }
        per_day_in_range_nock_leg: { type: string, nullable: true, description: NOCK per day }
        per_100_usd_per_day_in_range_usd: { type: string, nullable: true, description: Per $100 of the range's value at spot (its USDC plus its NOCK at the pool price) }
        per_day_in_range_diluted_usd: { type: string, nullable: true, description: 'x A/(A + L_new): A the pool''s active liquidity at the current tick (read at latest), L_new the hypothetical liquidity in range with it' }
        dilution: { type: object, nullable: true }
        dilution_reason: { type: string, nullable: true }
        spread: { type: object, nullable: true, description: 'Every UTC day at this range''s liquidity; min, true median and max over the days with at least day_min_seconds measured' }
        spread_reason: { type: string, nullable: true, description: Why the spread is null (a snapshot read back from a stored row keeps no by-day detail) }
        band_measured: { type: object, nullable: true, description: 'Stored intervals wholly inside this range: dollars and seconds; a per-day figure only from band_min_seconds' }
        band_reason: { type: string, nullable: true }
        in_range_share_stored_history: { type: object, nullable: true }
        in_range_share_reason: { type: string, nullable: true }
        stored_history_replay: { type: object, nullable: true, description: 'inside_upper_usd and edge_upper_usd: at most, from endpoint ticks sampled every ~5 minutes; no lower bound' }
        replay_reason: { type: string, nullable: true }
        coverage: { type: object, nullable: true, description: The part of the range inside the measuring range }
        constants: { type: object, description: 'window_days, max_gap_seconds, day_min_seconds, band_min_seconds: display constants, not settings' }
        assumptions: { type: array, items: { type: string } }

    LadderRung:
      type: object
      properties:
        index: { type: integer }
        rung: { type: string, enum: [cap, near, deep] }
        inputs: { type: object }
        bounds: { $ref: '#/components/schemas/LadderBounds' }
        sizing: { type: object, description: 'liquidity_raw (from the float sizing; the exact one is in mint), liquidity_human, usdc_at_spot, nock_needed_at_spot, nock_given, nock_check' }
        mint:
          type: object
          description: >
            The exact mint of a snapped rung: liquidity_raw is what the rung's USDC and NOCK
            (truncated to raw units, usdc_max_raw and nock_max_raw) buy, rounded down with
            Uniswap's integer formulas; amount0_raw and amount1_raw (and usdc_raw, nock_raw
            by token) are what a mint of it pulls, rounded up, never more than the maxima.
            status unavailable with a reason when unsnapped.
        plan: { type: object, description: 'shape=configured only: the rung''s status, target_usdc, deployed_usdc, remaining_usdc and tracked counterparts' }
        bottom: { type: object }
        top: { type: object }
        max_usdc_with_the_others_as_given: { type: string, nullable: true }
        fee_estimate: { $ref: '#/components/schemas/LadderFeeEstimate' }
        round_trip: { type: object, nullable: true, description: 'cap and near: a fall to the bottom and a return to the price now hand back what it started with; its gain is its fees' }
        if_pulled_at_fill: { type: object, nullable: true, description: 'deep: the NOCK kept if pulled when fully NOCK (a withdrawal the operator signs)' }
        cap: { type: object, description: 'shape=configured cap only: the band, the pool tick, band_rule, lp_nock_budget, nock, usdc and bound_by (lp_nock_budget | near_usdc | total_usdc)' }

    LadderCombined:
      type: object
      properties:
        rung_count: { type: integer }
        max_rungs: { type: integer }
        max_rungs_note: { type: string }
        total_usdc: { type: string }
        total_nock_needed: { type: string }
        deepest_bottom_usd: { type: string }
        nock_held_at_deepest_bottom: { type: string }
        nock_bought_at_deepest_bottom: { type: string }
        avg_buy_price_usd: { type: string, nullable: true }
        deep_rungs: { type: integer }
        nock_kept_if_deep_rungs_pulled: { type: string }
        nock_bought_by_deep_rungs: { type: string }
        avg_kept_price_usd: { type: string, nullable: true }
        max_usdc_total: { type: string, nullable: true, description: The most the rungs take in all with the stable balance at the gate still at the reserve }
        overlaps: { type: array, items: { type: object } }
        gate_price_usd: { type: string }
        gate_price_rule: { type: string }

    LadderTradeoff:
      type: object
      description: Measurement tables; rows in the order of the quantity varied, never ranked, none marked. The statement is the same in every surface.
      properties:
        split: { type: object, nullable: true, description: 'Two rungs only; the same total re-divided in steps of split_step_pct, plus the operator''s own split' }
        split_reason: { type: string, nullable: true }
        near_depth: { type: object, nullable: true, description: 'One near and one deep rung, snapped; the near rung''s bottom at each usable tick down to the deep rung''s top (at most max_rows)' }
        near_depth_reason: { type: string, nullable: true }
        deep_top: { type: object, nullable: true }
        deep_top_reason: { type: string, nullable: true }
        statement: { type: string }
        order: { type: string }
        columns_note: { type: string }

    ClaimFeesPayload:
      type: object
      required: [chain_id, from, generated_at, actions]
      properties:
        chain_id:
          type: integer
          example: 8453
        from:
          type: string
          description: Sovereign wallet that must sign (and receives the fees)
        generated_at:
          type: string
          format: date-time
        gross_usd:
          type: string
          nullable: true
          description: Total claimable fees in USD from the latest live snapshot
        estimated_gas_usd:
          type: string
          nullable: true
          description: Sum of live eth_estimateGas-based USD gas cost; null when unavailable
        net_after_gas_usd:
          type: string
          nullable: true
        actions:
          type: array
          description: >
            One action per configured position that is live. A position the latest
            snapshot lists in closed_positions (its NFT does not exist) gets no
            action: there is nothing to collect from it. (#144)
          items:
            $ref: '#/components/schemas/ClaimFeeAction'
        collectible_lp_fees_usd:
          type: string
          nullable: true
          description: Collectible LP fees in USD. The same figure as gross_usd, under its own name. (#142)
        collectible_rewards_usd:
          type: string
          nullable: true
          description: >
            Collectible gauge rewards in USD, the snapshot's
            global_status.collectible_rewards_usd. Null when not totalled (a gauge
            was not read, or a reward is unpriced); never a partial sum. (#142)
        collectible_rewards_note:
          type: string
          nullable: true
          description: Why collectible_rewards_usd and total_collectible_usd are null. (#142)
        total_collectible_usd:
          type: string
          nullable: true
          description: LP fees plus gauge rewards. Null whenever the rewards part is null. (#142)
        rewards:
          type: array
          description: >
            One row per position with a gauge reward. Information only; a row has
            no to and no data, so nothing in it can be sent to a wallet. NockNock
            builds no transaction for a reward. (#142)
          items:
            $ref: '#/components/schemas/ClaimRewardRow'

    ClaimRewardRow:
      type: object
      required: [position_id, label, status, token_symbol, collected_in, collect_url, gas_note]
      description: >
        A position's gauge reward in the claim payload (#142). It states what is
        collectible and where. It is not an action and carries no calldata.
      properties:
        position_id: { type: string }
        label: { type: string, example: "WETH+NOCK (Aero CL #2914490)" }
        status:
          type: string
          enum: [read, not_read]
          description: not_read has no amount and no USD value; note says why. (#142)
        token_symbol: { type: string, example: "AERO" }
        amount: { type: string, nullable: true, example: "17.654015" }
        usd: { type: string, nullable: true, example: "7.75" }
        gauge:
          type: string
          nullable: true
          description: The gauge the reward is collected from. (#142)
        collected_in: { type: string, example: "the Aero app" }
        collect_url: { type: string, example: "https://app.aero.xyz" }
        note: { type: string, nullable: true }
        gas_estimate:
          type: string
          nullable: true
          description: >
            Gas units of the claim call, hex, from a read-only eth_estimateGas sent
            from the tracked wallet at request time. Present only for a gauge whose
            claim call is verified on-chain (ONCHAIN_INTEGRATION.md section 9) and
            a reward greater than zero; null otherwise. (#142)
        gas_usd:
          type: string
          nullable: true
          description: gas_estimate at the live gas price and ETH/USD, 4 decimals; L2 execution gas only. The gas price is the payload's one eth_gasPrice read, the same price as actions[].gas_usd. Null when either input is missing. (#142)
        gas_note:
          type: string
          description: >
            The gas statement in words, for example "gas est. 363527 units
            (~$0.0059)" or "gas not estimated (claim call not verified for this
            gauge)". (#142)

    ClaimFeeAction:
      type: object
      required: [platform, label, to, data, value, simulation]
      properties:
        platform:
          type: string
          enum: [aerodrome, aerodrome-cl, uniswap-v4, uniswap-v3]
          description: The position's protocol. An aerodrome-cl position (v0.6.0) staked in its gauge is always not_claimable; an unstaked one is a collect() on the Aero CL position manager.
        label:
          type: string
          example: "Collect Uniswap V4 LP fees (NOCK/USDC #3163431)"
        to:
          type: string
          description: Contract address (Uniswap PositionManager)
        data:
          type: string
          description: Full unsigned calldata (0x-prefixed)
        value:
          type: string
          example: "0x0"
        expected_amount_0:
          type: string
          nullable: true
          description: Expected token0 amount (human units) from simulation/snapshot
        expected_amount_1:
          type: string
          nullable: true
          description: Expected token1 amount (human units)
        expected_usd:
          type: string
          nullable: true
        gas_estimate:
          type: string
          nullable: true
          description: eth_estimateGas result (hex wei-units of gas)
        gas_usd:
          type: string
          nullable: true
        simulation:
          type: string
          enum: [success, failed, unavailable, not_claimable]
          description: >
            Clients MUST only dispatch "success". not_claimable: the Aero pool's
            claimFees() reverts (no LP-claimable fees), or (v0.6.0) an aerodrome-cl
            position is staked in its gauge, where swap fees go to the gauge;
            simulation_detail carries the reason. The payload never contains an
            action that claims AERO from a gauge (#93): unclaimed AERO is stated in
            the snapshot, and claiming it is the operator's own act in the Aero
            app. Since #142 the simulation_detail of a not_claimable action ends
            with the position's reward and where it is collected, and the payload
            lists the rewards in its own rewards array. The action is excluded from
            estimated_gas_usd and net_after_gas_usd. unavailable: not simulated or
            the simulation got no answer; (v0.6.0) also an aerodrome-cl position
            that is not in the latest snapshot yet, or whose snapshot row carries
            a fees_note without a gauge, in which case expected_amount_0/1 and
            expected_usd are null (never a placeholder 0) and simulation_detail
            is the reason.
        simulation_detail:
          type: string
          nullable: true

    NotificationChannelReport:
      type: object
      required: [channel, status, detail]
      description: One notification channel's state (v0.6.0). Never carries a credential.
      properties:
        channel:
          type: string
          enum: [telegram, pushover, webhook]
        status:
          type: string
          enum: [configured, incomplete, not_configured, delivered, failed]
          description: |
            configured / incomplete / not_configured describe the config. incomplete
            means half of a channel's pair is set, so nothing is sent to it. delivered /
            failed appear only after a send.
        detail:
          type: string
          description: 'Which config keys are set, missing or ignored, or what the provider answered (for example "HTTP 401: Unauthorized").'

    NotificationStatus:
      type: object
      required: [any_configured, channels, fires_on, test_cooldown_seconds]
      properties:
        any_configured:
          type: boolean
        channels:
          type: array
          description: Always all three channels, in a fixed order.
          items:
            $ref: '#/components/schemas/NotificationChannelReport'
        cockpit_url:
          type: string
          nullable: true
          description: The link appended to each message, or null when none is configured.
        cockpit_url_note:
          type: string
          nullable: true
          description: A known mistake in cockpit_url, in words (for example a /lite path), or null.
        fires_on:
          type: string
          description: >
            When the worker notifies, in words. Since #144 that includes a tracked
            position closing (its NFT no longer exists), once, at the transition.
        test_cooldown_seconds:
          type: integer

    NotificationTestResult:
      type: object
      required: [sent, any_configured, message, channels]
      properties:
        sent:
          type: boolean
          description: False when no channel is configured; nothing was sent.
        any_configured:
          type: boolean
        message:
          type: string
        sent_at:
          type: string
          format: date-time
          description: Present only when sent is true.
        text:
          type: string
          description: The exact message sent. Present only when sent is true.
        channels:
          type: array
          items:
            $ref: '#/components/schemas/NotificationChannelReport'

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Optional API key for rate limiting / multi-tenant

security:
  - ApiKeyAuth: []