openapi: 3.0.3
info:
  title: NockNock Snapshot Data Model
  version: 2.6.0
  description: Canonical schemas for portfolio snapshots, derived metrics, and API envelopes. Single source of truth for backend ↔ frontend contract.
  license:
    name: ISC
servers:
  - url: https://api.nocknock.xyz/v1
    description: Production (components only)
paths: {}

components:
  schemas:
    # ============================================================
    # TOP-LEVEL ENVELOPE (every API response wraps this)
    # ============================================================
    SnapshotEnvelope:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/SnapshotMeta'
        data:
          $ref: '#/components/schemas/SnapshotData'
        data_provenance:
          $ref: '#/components/schemas/DataProvenance'

    DataProvenance:
      type: object
      required: [last_backfill_at, backfilled_points_count]
      description: >-
        Backfill telemetry for the market price history. Computed live per
        request; deliberately excluded from `state_hash`/ETag so snapshot
        deduplication stays stable.
      properties:
        last_backfill_at:
          type: string
          format: date-time
          nullable: true
          description: When the most recent third-party gap fill landed (null if none)
        backfilled_points_count:
          type: integer
          description: Stored price points sourced from third-party OHLCV feeds
        sources:
          type: object
          additionalProperties:
            type: integer
          description: Backfilled point count per provider (e.g. geckoterminal, dexscreener)

    SnapshotMeta:
      type: object
      required: [generated_at, state_hash, version, snapshot_id]
      properties:
        generated_at:
          type: string
          format: date-time
          description: UTC timestamp when this snapshot was computed
          example: "2026-10-09T17:23:29.123Z"
        state_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 hash of the canonicalized SnapshotData (deterministic ordering)
          example: "a1b2c3d4e5f6789012345678901234567890abcdef1234567890abcdef123456"
        version:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
          description: Schema version of the data payload
          example: "1.0.0"
        snapshot_id:
          type: string
          format: uuid
          description: Unique identifier for this snapshot (ULID or UUIDv7 preferred)
          example: "01arz3ndekt4rrffq69g5fav-0000"  # ULID with dashes to satisfy uuid format

    # ============================================================
    # CORE SNAPSHOT DATA — what the frontend consumes
    # ============================================================
    SnapshotData:
      type: object
      required:
        - wallet_balances
        - positions
        - pool_mechanics
        - concentrated_liquidity
        - contract_fees
        - derived_metrics
      properties:
        wallet_balances:
          type: array
          items:
            $ref: '#/components/schemas/WalletBalance'
          description: Liquid wallet balances (native tokens, stablecoins)
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
          description: |
            Tracked LP positions (v2.0.0). Replaces the retired two-tranche shape
            (live_tranche_1_* / live_tranche_2_* inputs and the tranche_N_nock series);
            one entry per operator-configured position.
        pool_mechanics:
          type: array
          items:
            $ref: '#/components/schemas/PoolMechanic'
          description: AMM pool mechanics for the tracked pools (Uniswap v3/v4; Aerodrome historical)
        concentrated_liquidity:
          type: array
          items:
            $ref: '#/components/schemas/ConcentratedLiquidity'
          description: |
            DEPRECATED since v2.0.0 — superseded by `positions`. Kept in the schema so
            historical snapshot rows remain readable; the worker emits an empty array.
        contract_fees:
          type: array
          items:
            $ref: '#/components/schemas/ContractFee'
          description: Unclaimed processing fees sitting in contracts
        derived_metrics:
          $ref: '#/components/schemas/DerivedMetrics'

    # ============================================================
    # RAW ON-CHAIN TRACKING COMPONENTS
    # ============================================================
    WalletBalance:
      type: object
      description: |
        One wallet token balance. Rows are NOCK, USDC, then (2.3.0) ETH (zero address)
        and WETH: the gas pillar, then (v0.6.0, #93) AERO, the fourth pillar. Every row
        is a required live read; a failed read fails the cycle, never reads as 0. Gas
        and AERO rows are counted in total_portfolio_usd but are never cash, never
        deployable dry powder and never fund an LP deposit. AERO is the token the Aero
        gauges pay, 0x3f5bF3EdAc59d650D8fDf9657a71F2f904A3a4Ee (name "Aero"); the older
        "Aerodrome" token with the same symbol is not read. A snapshot from before
        v0.6.0 has no AERO row.
      required: [wallet_address, token_symbol, token_address, amount, amount_usd]
      properties:
        wallet_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          example: "0x742d35Cc6634C0532925a3b844Bc9e7595f8fEb5"
        token_symbol:
          type: string
          example: "NOCK"
        token_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          description: Contract address (zero address for native token)
          example: "0x0000000000000000000000000000000000000000"
        amount:
          type: string
          description: Amount in human token units as a decimal string (ETH and WETH to 6 decimals)
          example: "115747.8001"
        amount_usd:
          type: string
          description: USD value at snapshot time (decimal string)
          example: "12345.67"
        updated_at:
          type: string
          format: date-time
          description: When this balance was last observed on-chain

    Position:
      type: object
      description: One tracked LP position, read live from its NFT position manager.
      required: [position_id, network, wallet, protocol, nft_id, pool_id, fee_tier_bps, token0, token1, amount0, amount1, amount_usd, tokens_owed_0, tokens_owed_1, fees_usd, lower_tick, upper_tick, lower_price, upper_price, liquidity_amount, in_range]
      properties:
        position_id:
          type: string
          description: Stable identifier ("{protocol}:{network}:{nft_id}")
          example: "uniswap-v4:base:3163431"
        network:
          type: string
          description: Chain the position lives on
          example: "base"
        wallet:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          description: Owning wallet
        protocol:
          type: string
          enum: [uniswap-v4, uniswap-v3, aerodrome, aerodrome-cl]
          description: >
            AMM family. aerodrome is an Aero basic volatile pool (an LP-token share,
            full range). aerodrome-cl is an Aero concentrated-liquidity (Slipstream)
            NFT position, staked in its gauge or held by the wallet (v0.6.0).
        nft_id:
          type: integer
          description: Position NFT token id on the position manager
          example: 3163431
        pool_id:
          type: string
          description: Uniswap v4 bytes32 poolId, or the pool contract address (v3, aerodrome, aerodrome-cl)
        npm_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          nullable: true
          description: The position manager that minted the NFT (uniswap-v3 and aerodrome-cl positions only)
        fee_tier_bps:
          type: integer
          description: Fee tier in basis points (200 = 2%, 75 = 0.75%)
          example: 75
        token0:
          $ref: '#/components/schemas/PositionToken'
        token1:
          $ref: '#/components/schemas/PositionToken'
        amount0:
          type: string
          description: Current position amount of token0 (human units, decimal string)
        amount1:
          type: string
          description: Current position amount of token1 (human units, decimal string)
        amount_usd:
          type: string
          description: Total position value in USD (decimal string)
        tokens_owed_0:
          type: string
          description: Unclaimed fees of token0 (human units)
        tokens_owed_1:
          type: string
          description: Unclaimed fees of token1 (human units)
        fees_usd:
          type: string
          description: Unclaimed fees in USD (decimal string)
        lower_tick:
          type: integer
        upper_tick:
          type: integer
        lower_price:
          type: string
          description: Range bound in human token0-per-token1 units
        upper_price:
          type: string
          description: Range bound in human token0-per-token1 units
        liquidity_amount:
          type: string
          description: Raw on-chain liquidity L (decimal string)
        in_range:
          type: boolean
          description: Whether the current tick is within the position range
        is_price_source:
          type: boolean
          description: True for the one position whose pool supplies the NOCK/USD spot
        pool_active:
          type: boolean
          nullable: true
          description: False when the position's pool has no in-range liquidity (frozen price; in_range is then meaningless). Null when the pool read failed. (2.2.0)
        full_range:
          type: boolean
          description: True for a position spanning every price (an Aerodrome volatile pool). It cannot go out of range; lower_price/upper_price are then "0" and not meaningful. (2.2.0)
        tick_spacing:
          type: integer
          description: aerodrome-cl only. The pool's tick spacing (200 for a CL200 pool). Absent for every other protocol. fee_tier_bps is the pool's current swap fee, which is dynamic on Aero CL pools. (v0.6.0)
          example: 200
        staked_in_gauge:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
          description: aerodrome-cl only. The gauge that holds the position NFT, present when the tracked wallet staked it there (proved each cycle by the gauge's stakedContains). Absent when the wallet holds the NFT itself. (v0.6.0)
        fees_note:
          type: string
          description: >
            Present when tokens_owed_0, tokens_owed_1 and fees_usd are NOT a read of
            LP-claimable fees; it is the reason and clients show it in their place,
            never "$0 earned". A staked aerodrome-cl position: swap fees on staked
            liquidity go to the gauge. The AERO earned instead is in unclaimed_aero
            (v0.6.0, #93), not in this note. Absent when the fee figures were read,
            which is every other position: an unstaked aerodrome-cl position's fees
            are read from a collect() simulation, and a revert there fails the
            cycle. (v0.6.0)
        unclaimed_aero:
          type: string
          description: >
            AERO this position has earned in its gauge and not claimed, in AERO to 6
            decimals: the gauge's earned(wallet) for an aerodrome position with a
            gauge_address, earned(wallet, [nft_id]) for a staked aerodrome-cl
            position. "0.000000" is a read zero. Not part of amount_usd, fees_usd or
            total_portfolio_usd. Absent for every position that cannot earn AERO
            (Uniswap, an unstaked aerodrome-cl NFT), when the gauge was not read
            (see unclaimed_aero_note), and on a snapshot from before v0.6.0: clients
            show "not reported", never 0. NockNock states this amount and gives no
            advice about it. (v0.6.0, #93)
          example: "11.922078"
        unclaimed_aero_usd:
          type: string
          description: >
            unclaimed_aero at aero_price_usd, 2 decimals. Absent when AERO could not
            be priced this cycle (a zero amount is "0.00" whatever the price).
            (v0.6.0, #93)
          example: "4.98"
        unclaimed_aero_note:
          type: string
          description: >
            Why unclaimed_aero is absent for an Aero position that could earn AERO:
            an aerodrome position with no gauge_address configured, a gauge whose
            earned() read reverted or failed this cycle, or a gauge whose
            rewardToken() names a token other than AERO (a legacy Aerodrome gauge
            answers earned() in the older token 0x940181a9…8631; its figure is not
            published as AERO). The read is optional: it does not fail the cycle,
            and the value is never published as 0. (v0.6.0, #93)

    PositionToken:
      type: object
      required: [address, symbol, decimals]
      properties:
        address:
          type: string
          description: Token contract (zero address = native ETH in v4)
          pattern: '^0x[a-fA-F0-9]{40}$'
        symbol:
          type: string
          example: "NOCK"
        decimals:
          type: integer
          example: 16

    PoolMechanic:
      type: object
      required: [pool_id, platform, pool_type, volatile_assets, liquidity_usd, fee_accrued_usd, fee_tier_bps]
      properties:
        pool_id:
          type: string
          pattern: '^0x[a-fA-F0-9]{40,64}$'
          description: Pool contract address (v3) or bytes32 poolId (v4)
          example: "0x91a9ef0a8dd231b99fa53a2a145a9e8bca7897e0d85852107abb997916f9f99c"
        platform:
          type: string
          enum: [Aerodrome, UniswapV4, UniswapV3, Velodrome, Other]
          example: "UniswapV4"
        pool_type:
          type: string
          enum: [volatile, stable, concentrated]
          example: "volatile"
        volatile_assets:
          type: array
          items:
            $ref: '#/components/schemas/PoolAsset'
          description: The tracked wallet's amounts in this pool (not pool-wide reserves)
        liquidity_usd:
          type: string
          description: Total liquidity in USD (decimal string)
          example: "500000.00"
        fee_accrued_usd:
          type: string
          description: >
            Unclaimed fees in USD (decimal string). "0.000000" is NOT an amount
            earned when the position at the same index of `positions` carries a
            fees_note (a staked aerodrome-cl position, v0.6.0): its LP-claimable
            fees are not a figure at all, and the note is the reason.
          example: "123.45"
        fee_tier_bps:
          type: integer
          description: Fee tier in basis points
          example: 30
        tick_current:
          type: integer
          description: Current tick (for concentrated pools)
          nullable: true
        sqrt_price_x96:
          type: string
          description: Current sqrt price (for Uniswap V3/V4)
          nullable: true

    PoolAsset:
      type: object
      required: [token_address, token_symbol, reserve_amount, reserve_usd]
      properties:
        token_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        token_symbol:
          type: string
        reserve_amount:
          type: string
          description: Raw reserve amount (decimal string)
        reserve_usd:
          type: string
          description: USD value of reserve (decimal string)

    ConcentratedLiquidity:
      type: object
      required:
        - range_id
        - pool_id
        - lower_tick
        - upper_tick
        - lower_price
        - upper_price
        - liquidity_amount
        - tokens_owed_0
        - tokens_owed_1
      properties:
        range_id:
          type: string
          description: Unique identifier for this range position
          example: "0x1234...5678-100-200"
        pool_id:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        lower_tick:
          type: integer
          example: -198000
        upper_tick:
          type: integer
          example: -197000
        lower_price:
          type: string
          description: Lower price bound (decimal string, token1/token0)
          example: "0.00123"
        upper_price:
          type: string
          description: Upper price bound (decimal string)
          example: "0.00125"
        liquidity_amount:
          type: string
          description: Liquidity provided in this range (decimal string)
        tokens_owed_0:
          type: string
          description: Unclaimed fees for token0 (decimal string)
        tokens_owed_1:
          type: string
          description: Unclaimed fees for token1 (decimal string)
        in_range:
          type: boolean
          description: Whether current price is within this range
        fee_growth_inside_0_x128:
          type: string
          description: Fee growth accumulator for token0
        fee_growth_inside_1_x128:
          type: string
          description: Fee growth accumulator for token1

    ContractFee:
      type: object
      required: [contract_address, fee_token_address, fee_token_symbol, amount, amount_usd, claimable]
      properties:
        contract_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        fee_token_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        fee_token_symbol:
          type: string
        amount:
          type: string
          description: >
            Either the unclaimed amounts ("0.01 USDC + 2.5 NOCK"), or, when the
            position has no LP-claimable fee figure, the reason in their place. A
            reason always starts with "not LP-claimable": an Aero basic pool whose
            claimFees() reverts, or (v0.6.0) an aerodrome-cl position staked in
            its gauge, whose text is positions[].fees_note. Clients test for that
            prefix and print the reason instead of an amount. Since v0.6.0 (#93)
            the reason is followed by "; " and the position's AERO statement when
            it has one: "unclaimed AERO 11.922078 ($4.98)", "unclaimed AERO
            11.922078 (USD value unavailable)" or "unclaimed AERO not read
            (<reason>)". The statement is an amount, never advice.
        amount_usd:
          type: string
          description: >
            USD value (decimal string). When `amount` is a "not LP-claimable"
            reason this is "0.000000" and is NOT an amount earned: nothing was
            read, and it adds nothing to the claimable total.
        claimable:
          type: boolean
          description: Whether fees are currently claimable (gas-economic)
        gas_break_even_usd:
          type: string
          description: Estimated gas cost to claim (decimal string)
          example: "5.23"

    # ============================================================
    # DERIVED METRICS — pre-computed for the "Storyboard Visual Layout"
    # ============================================================
    DerivedMetrics:
      type: object
      required:
        - global_status
        - asset_aggregation_series
        - total_value_vs_baseline
        - tick_bracket_hypervisor
        - portfolio_deviation_matrix
        - structural_channels
        - strategy_counterfactual
        - velocity_gas_sandbox
      properties:
        global_status:
          $ref: '#/components/schemas/GlobalStatus'
        asset_aggregation_series:
          $ref: '#/components/schemas/AssetAggregationSeries'
        total_value_vs_baseline:
          $ref: '#/components/schemas/TotalValueVsBaseline'
        tick_bracket_hypervisor:
          $ref: '#/components/schemas/TickBracketHypervisor'
        portfolio_deviation_matrix:
          $ref: '#/components/schemas/PortfolioDeviationMatrix'
        structural_channels:
          $ref: '#/components/schemas/StructuralChannels'
        strategy_counterfactual:
          $ref: '#/components/schemas/StrategyCounterfactual'
        velocity_gas_sandbox:
          $ref: '#/components/schemas/VelocityGasSandbox'
        sovereign_ledger:
          $ref: '#/components/schemas/SovereignLedger'
        accumulation_plan:
          type: object
          allOf:
            - $ref: '#/components/schemas/AccumulationPlanStatus'
          nullable: true
          description: Dollar-cost-averaging plan status (2.1.0); null when no plan is configured
        lp_rebuild:
          $ref: '#/components/schemas/LpRebuild'
        cost_basis:
          type: object
          allOf:
            - $ref: '#/components/schemas/CostBasis'
          nullable: true
          description: |
            NOCK cost basis (v0.6.0, issue #98). Null or absent in a snapshot stored
            before the field existed: unknown, never a zero basis.

    CostBasis:
      type: object
      description: |
        What the NOCK cost, against what it is worth at spot (v0.6.0), in two layers kept
        apart. `plan_buys` is exact: it comes only from receipt-verified rows in the
        accumulation ledger. `whole_stack` exists only when the operator enters an
        opening basis in config (`cost_basis.opening`); NockNock cannot derive the
        stack's history from the chain and never invents it. Every figure is a
        measurement. Nothing here is advice to buy or sell.
      required: [plan_buys, whole_stack]
      properties:
        spot_price_usd:
          type: string
          nullable: true
          description: NOCK/USD spot the differences are measured at; null when there is no price
          example: "0.011530"
        plan_buys:
          $ref: '#/components/schemas/PlanBuysBasis'
        whole_stack:
          $ref: '#/components/schemas/WholeStackBasis'

    PlanBuysBasis:
      type: object
      description: |
        Average cost of the receipt-verified buys in the accumulation ledger, across
        every plan (v0.6.0). Needs no operator input.
      required: [status, fills]
      properties:
        status:
          type: string
          enum: [ok, no_fills, unavailable]
          description: |
            `no_fills`: the ledger holds no verified buy. `unavailable`: the ledger could
            not be read this cycle (see `reason`); never reported as "no buys".
        reason:
          type: string
          nullable: true
        fills:
          type: integer
          nullable: true
          description: |
            Verified buys counted. Null when `status` is `unavailable`: the ledger was
            not read, so the count is unknown, not 0. 0 only with `no_fills`.
        spent_usdc:
          type: string
          nullable: true
          description: USDC that left the wallet across the verified buys
        acquired_nock:
          type: string
          nullable: true
        avg_cost_usd:
          type: string
          nullable: true
          description: spent_usdc / acquired_nock; null without a verified buy
          example: "0.011768"
        first_fill_at:
          type: string
          format: date-time
          nullable: true
        last_fill_at:
          type: string
          format: date-time
          nullable: true
        value_at_spot_usd:
          type: string
          nullable: true
          description: acquired_nock at spot_price_usd; null when there is no price
        unrealized_usd:
          type: string
          nullable: true
          description: |
            value_at_spot_usd less spent_usdc, signed (negative = worth less than it
            cost). A valuation of the NOCK these buys acquired, not a statement that it
            is still held: NockNock does not track whether it was later sold or moved
            into LP.
          example: "-1.21"
        unrealized_pct:
          type: string
          nullable: true
          description: The same difference as a percentage of spent_usdc, signed
          example: "-2.02"
        plans:
          type: array
          description: The same figures per plan id, oldest plan first
          items:
            type: object
            required: [plan_id, fills, spent_usdc, acquired_nock, avg_cost_usd, first_fill_at, last_fill_at]
            properties:
              plan_id: { type: string }
              fills: { type: integer }
              spent_usdc: { type: string }
              acquired_nock: { type: string }
              avg_cost_usd: { type: string }
              first_fill_at: { type: string, format: date-time }
              last_fill_at: { type: string, format: date-time }
        includes:
          type: array
          items: { type: string }
          description: |
            Plain-words statements of exactly what the figures count. Emptied in
            `/snapshot/historical` rows (fixed prose; the figures stay).
        excludes:
          type: array
          items: { type: string }
          description: Plain-words statements of what the figures leave out

    WholeStackBasis:
      type: object
      description: |
        Blended average of the operator-entered opening basis and the verified buys
        confirmed after it (v0.6.0):
        (opening_cost_usd + bought_since_usdc) / (opening_nock + bought_since_nock).
        The opening figures are the operator's own, labelled with their `source`; NockNock
        neither reads nor checks them. Sells, LP rebalancing, fees and unrecorded buys
        after `as_of` are not tracked (`excludes` says so).
      required: [status]
      properties:
        status:
          type: string
          enum: [not_configured, ok, invalid, unavailable]
          description: |
            `not_configured`: no `cost_basis.opening` in config, so there is no
            whole-stack figure. `invalid`: the block is present but unusable (half-filled,
            a zero or negative amount, an as_of that is not a full past timestamp);
            `reason` says what to fix and no number is reported. `unavailable`: the
            accumulation ledger could not be read this cycle.
        reason:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
          description: The operator's note on where the opening figures came from
        as_of:
          type: string
          format: date-time
          nullable: true
          description: The instant the opening figures were read; buys at or before it are not added again
        opening_nock:
          type: string
          nullable: true
        opening_cost_usd:
          type: string
          nullable: true
        opening_avg_cost_usd:
          type: string
          nullable: true
        fills_since:
          type: integer
          nullable: true
          description: Verified buys confirmed after as_of
        bought_since_usdc:
          type: string
          nullable: true
        bought_since_nock:
          type: string
          nullable: true
        basis_nock:
          type: string
          nullable: true
          description: opening_nock + bought_since_nock, the NOCK this average covers
        basis_cost_usd:
          type: string
          nullable: true
        avg_cost_usd:
          type: string
          nullable: true
          description: basis_cost_usd / basis_nock
        value_at_spot_usd:
          type: string
          nullable: true
          description: basis_nock at spot_price_usd (not the NOCK held now; see held_nock)
        unrealized_usd:
          type: string
          nullable: true
          description: value_at_spot_usd less basis_cost_usd, signed
        unrealized_pct:
          type: string
          nullable: true
        held_nock:
          type: string
          nullable: true
          description: |
            NOCK read this cycle (wallet plus tracked LP), to the nearest whole NOCK (it
            is `global_status.total_nock_amount`), for comparison with basis_nock. The
            two differ by everything the basis does not track.
          example: "118714"
        includes:
          type: array
          items: { type: string }
        excludes:
          type: array
          items: { type: string }

    SovereignLedger:
      type: object
      description: |
        Virtual sub-ledger over receipt-verified fee harvests: bookkeeping inside the
        single wallet. Nothing is moved, locked or set aside on-chain.
        tax_reserve_usd = cumulative_harvested_usd * operator_profile.tax_reserve_ratio
        (default 0, no reserve); growth_dry_powder_usd is the remainder. Each harvest row
        (USDC, NOCK, WETH, or ETH unwrapped by a Uniswap position manager) is valued at
        its claim's block (2.4.0): NOCK at the stored price nearest the block time (within
        60 minutes), ETH/WETH at the ETH price pool's slot0 at that block. A row with no
        price found has no USD value and is left out of cumulative_harvested_usd.
      properties:
        cumulative_harvested_usd:
          type: string
          description: Sum of the USD values of receipt-verified harvest rows that have one
        tax_reserve_usd:
          type: string
          description: The configured ratio's share of the total (virtual; not protected or locked)
        growth_dry_powder_usd:
          type: string
          description: The rest of the total, not booked to the reserve (virtual; not a spendable balance)
        harvest_count:
          type: integer
          description: Number of distinct verified harvest transactions
        last_harvest_at:
          type: string
          format: date-time
          nullable: true
        tax_reserve_ratio:
          type: string
          description: The configured operator_profile.tax_reserve_ratio the split uses, e.g. "0.40"; "0.00" when none is configured (2.4.0)
        unpriced_count:
          type: integer
          description: Harvest rows with no USD value (no price found at their block), left out of the total (2.4.0)

    AccumulationPlanStatus:
      type: object
      description: |
        Progress of the operator's dollar-cost-averaging plan (2.1.0). Derived only from
        the `accumulation_plan` config and receipt-verified rows in the accumulation
        ledger — never from assumed fills. The plan paces buys; it does not execute them.
      required: [plan_id, status, venue, tranche_index, tranches_total, tranche_usdc, nominal_tranche_usdc, budget_usdc, spent_usdc, remaining_usdc, acquired_nock, fills]
      properties:
        plan_id:
          type: string
        status:
          type: string
          enum: [pending, tranche_due, waiting, paused, blocked, complete, invalid]
        venue:
          type: string
          description: Where the operator executes (label)
        tranche_index:
          type: integer
          description: 1-based index of the next tranche (verified fills + 1)
        tranches_total:
          type: integer
        tranche_usdc:
          type: string
          description: Amount advised now, after guardrails ("0.00" unless status is tranche_due)
        nominal_tranche_usdc:
          type: string
          description: budget / tranches, before guardrails
        next_due_at:
          type: string
          format: date-time
          nullable: true
        budget_usdc:
          type: string
        spent_usdc:
          type: string
        remaining_usdc:
          type: string
        acquired_nock:
          type: string
        fills:
          type: integer
          description: Number of receipt-verified buys
        last_fill_at:
          type: string
          format: date-time
          nullable: true
        avg_price_usd:
          type: string
          nullable: true
          description: Total USDC spent / total NOCK received; null before the first fill
        lump_sum_nock:
          type: string
          nullable: true
          description: NOCK the whole budget would have bought at the first fill's price; null before the first fill
        binding_constraint:
          type: string
          nullable: true
          description: Reason when paused/blocked/invalid, or the guardrail that shrank a due tranche
        cash_reserve_usdc:
          type: string
          nullable: true
          description: Protected cash reserve the plan never draws below; null when none is set
        fill_detection:
          type: object
          allOf:
            - $ref: '#/components/schemas/FillDetection'
          nullable: true
          description: |
            Swaps found on-chain that look like plan buys, offered for confirmation, and
            whether the check ran (v0.6.0). Offers are not progress: `fills`, `spent_usdc`,
            `avg_price_usd` and the cadence count ledger rows only. Null in snapshots
            from before v0.6.0.

        route_quotes:
          type: object
          allOf:
            - $ref: '#/components/schemas/RouteQuotes'
          nullable: true
          description: |
            Read-only quotes for this exact tranche on Aero and on Uniswap (v0.7.0).
            Present only while `status` is `tranche_due` and quoting is on
            (`route_quotes.enabled`); null otherwise and in snapshots from before
            v0.7.0. The whole object is excluded from `state_hash`: a quote is a
            contract read at a stated block and says nothing about the wallet's state.
            The snapshot's ETag is that hash, so a conditional GET can keep an older
            copy of this object: `GET /v1/accumulation/quotes/latest` always answers
            with the one the worker holds. A snapshot the worker read back from its
            database at start-up carries null here until the first cycle.

    RouteQuotes:
      type: object
      description: |
        Quotes for one due tranche (v0.7.0, issue #115). The worker asks each venue's
        own quoter contract, with `eth_call` only, what the plan's tranche amount
        returns in NOCK along each route of a built-in, verified table, all at one
        block, and reports each venue's best route. Nothing is signed, built or sent;
        no amount other than the tranche the plan produced is ever quoted; a quote that
        fails or reverts is `unavailable` with its reason and is never replaced by an
        estimate or an older quote. This compares execution routes for a buy the plan
        already sized. It is not a recommendation to buy, and the wallet app's own
        router may pick a different route.
      required: [status, amount_usdc, venues, comparison]
      properties:
        status:
          type: string
          enum: [ok, partial, unavailable]
          description: ok when both venues were quoted, partial when one was, unavailable when none was. `detail` says what is missing.
        detail:
          type: string
          nullable: true
        amount_usdc:
          type: string
          description: The plan's own tranche amount that was quoted (equal to `tranche_usdc`)
        block_number:
          type: integer
          nullable: true
          description: The block every quote in this object was read at; null when no block was read
        quoted_at:
          type: string
          format: date-time
          nullable: true
          description: That block's time
        reference_spot_usd:
          type: string
          nullable: true
          description: The snapshot's NOCK/USD reference spot the costs are measured against (the price-source pool's price for this cycle, eight decimals). Present even when no venue could be quoted, so a refresh measures against the same figure. Null when the cycle had none; costs are then null too.
        venues:
          type: array
          description: One entry per venue, Aero first, then Uniswap
          items:
            $ref: '#/components/schemas/VenueQuote'
        more_nock_venue:
          type: string
          nullable: true
          description: The venue that returns more NOCK at that block. Null unless both venues were quoted and their amounts differ. A fact about two reads, not advice.
        more_nock_by_pct:
          type: string
          nullable: true
          description: How much more, in percent of the other venue's amount, two decimals ("0.00" when the difference is below 0.005%)
        comparison:
          type: string
          description: The comparison as one sentence, e.g. "Aero returns more NOCK by 0.05% for $20.00 USDC at block 58081910 ..."; with one quote or none it says there is nothing to compare

    VenueQuote:
      type: object
      description: One venue's best verified route for the tranche, or why it could not be quoted (v0.7.0)
      required: [venue, status, swap_url]
      properties:
        venue:
          type: string
          enum: [Aero, Uniswap]
        status:
          type: string
          enum: [quoted, unavailable]
        reason:
          type: string
          nullable: true
          description: Why, when unavailable. Every numeric field is then null.
        swap_url:
          type: string
          description: The venue's own swap page (https://app.aero.xyz/swap or https://app.uniswap.org/swap). No token or amount is prefilled.
        nock_out:
          type: string
          nullable: true
          description: NOCK the quoter returned for `amount_usdc` along `route`, exact (16 decimals)
        effective_price_usd:
          type: string
          nullable: true
          description: amount_usdc / nock_out, eight decimals
        cost_over_spot_pct:
          type: string
          nullable: true
          description: (effective_price_usd / reference_spot_usd - 1) x 100, two decimals. Negative when the route beats the reference pool's mid price. Null without a reference spot.
        route:
          type: string
          nullable: true
          description: The best route's tokens, e.g. "USDC → WETH → NOCK"
        hops:
          type: array
          items:
            $ref: '#/components/schemas/RouteHop'
        routes_tried:
          type: array
          description: Every candidate route of this venue with its own result
          items:
            type: object
            required: [route_id, route]
            properties:
              route_id: { type: string }
              route: { type: string }
              nock_out: { type: string, nullable: true }
              reason: { type: string, nullable: true, description: "Why this route gave no quote" }

    RouteHop:
      type: object
      required: [pool, pool_kind, token_in, token_out]
      properties:
        pool:
          type: string
          description: Pool address, or the 32-byte pool id for a Uniswap v4 pool
        pool_kind:
          type: string
          enum: [Aero basic volatile, Aero concentrated, Uniswap v3, Uniswap v4]
        token_in:
          type: string
        token_out:
          type: string
        fee_pct:
          type: string
          nullable: true
          description: Swap fee in percent. Aero fees are read at the quote block (they can change); Uniswap fees are fixed by the pool. Null when the fee read failed; the quote itself stands.

    FillDetection:
      type: object
      description: |
        One cycle's fill detection for the accumulation plan (v0.6.0, issue #118). While a
        plan is active the worker reads the tracked wallet's incoming NOCK transfers back
        to the plan anchor and checks each transaction it has not seen before against
        its receipt, with the rules of POST /execute/record-accumulation. A swap that
        passes is offered; it is recorded only when the operator confirms it, through
        that same endpoint, which verifies the receipt again. Detection never fails the
        cycle and has no thresholds: nothing is filtered by size or price.
      required: [status, offers, dismissed]
      properties:
        status:
          type: string
          enum: [ok, partial, unavailable, not_run]
          description: |
            ok: the transfer history was read back to the plan anchor and every new
            transaction was examined (an empty `offers` then means "checked, none found").
            partial: read, but incompletely; `detail` says what is missing (a receipt
            that could not be read is retried, never classified).
            unavailable: could not check this cycle; `detail` says why. This is not
            "none found". Swaps found by an earlier check stay in `offers`.
            not_run: not attempted; `detail` says why (the plan is invalid, has not
            started or has spent its budget; the ledger could not be read; or
            `fill_detection.enabled` is false).
        detail:
          type: string
          nullable: true
          description: Plain-words reason for partial, unavailable and not_run
        checked_back_to:
          type: string
          format: date-time
          nullable: true
          description: How far back the transfer history was read. The plan anchor after a complete check; a later time when the check was cut short. Null when it did not run.
        last_checked_at:
          type: string
          format: date-time
          nullable: true
          description: Time of the last successful check; null when none is on record. A wall-clock field, excluded from `state_hash` like `updated_at`.
        offers:
          type: array
          description: Detected swaps waiting for the operator's answer (confirm, or mark as not part of the plan), oldest first. Never includes a transaction already in the ledger or one from before the plan anchor.
          items:
            $ref: '#/components/schemas/FillOffer'
        dismissed:
          type: array
          description: Detected swaps the operator marked "not part of the plan". Not counted; kept and restorable.
          items:
            $ref: '#/components/schemas/FillOffer'

    FillOffer:
      type: object
      description: |
        A detected USDC to NOCK swap by the tracked wallet (v0.6.0). Every figure comes
        from the transaction's receipt and block header. It is shown at its real size:
        it is not matched to the tranche amount.
      required: [tx_hash, confirmed_at, block_number, usdc_spent, nock_received, effective_price_usd, timing]
      properties:
        tx_hash:
          type: string
          description: Lowercase, 0x-prefixed. Confirming posts this hash to /execute/record-accumulation.
        confirmed_at:
          type: string
          format: date-time
          description: Block time of the swap
        block_number:
          type: integer
        usdc_spent:
          type: string
        nock_received:
          type: string
        effective_price_usd:
          type: string
          description: USDC spent / NOCK received
        timing:
          type: string
          enum: [early, on_schedule]
          description: >-
            early when the swap landed less than one plan interval after the buy before it,
            otherwise on_schedule. "The buy before it" is the latest of this plan's recorded
            fills at or before the swap's block time and the older swaps still on offer; a
            dismissed swap is nobody's previous buy. The plan's first buy is never early.
        reference_spot_usd:
          type: string
          nullable: true
          description: The stored NOCK/USD price nearest the swap's block time (within 60 minutes); null when none was near
        reference_spot_source:
          type: string
          nullable: true
          description: >-
            Where the reference came from, with its own timestamp. Clients show it next to
            the cost figure: a price move between that time and the swap reads as cost.
        execution_cost_bps:
          type: integer
          nullable: true
          description: (effective_price_usd / reference_spot_usd - 1) x 10,000; positive means the swap paid more than the reference. Null without a reference, never a substitute.

    LpRebuild:
      type: object
      description: |
        Standing bias toward re-establishing LP ranges (2.1.0). Moving NOCK and USDC the
        wallet already holds into positions is a reposition, not a purchase:
        total_stable_usd (wallet USDC + USDC inside positions) does not change.
      properties:
        status:
          type: string
          description: no_positions when no LP position is tracked; no_target when no LP target weight is configured (target_weights_bps.uniswap_lp unset or 0). Neither carries suggestions or bias text.
          enum: [under_target, on_target, over_target, no_positions, no_target]
        target_usd:
          type: string
        actual_usd:
          type: string
        gap_usd:
          type: string
          description: target - actual, floored at zero
        target_weight_bps:
          type: integer
        suggestions:
          type: array
          description: Concrete deposits that would close the gap, one per eligible tracked position (2.2.0)
          items:
            $ref: '#/components/schemas/LpSuggestion'
        excluded:
          type: array
          description: Tracked positions deliberately left out, with the reason (2.2.0). Since 2.3.0 a position with an ETH or WETH leg is always excluded (wallet ETH is gas, not investable capital) and its share goes to the eligible positions. Since v0.6.0 an aerodrome-cl position is always excluded, whatever its pair: no verified way to add to its NFT exists (the Aero app's deposit link starts a new position).
          items:
            type: object
            properties:
              position_id: { type: string }
              nft_id: { type: integer }
              label: { type: string }
              reason: { type: string }
        floor_tolerance_nock:
          type: string
          nullable: true
          description: NOCK the operator tolerates below the floor in a full LP sell-out
        worst_case_nock:
          type: string
          nullable: true
          description: Total NOCK left if every range, existing and suggested, sold all its NOCK

    LpSuggestion:
      type: object
      description: |
        A suggested deposit into an existing tracked position (2.2.0). Amounts are what the
        position's range takes at its pool's current price for `add_usd` of value. Only
        positions whose pool is live and which are in range are suggested (unless config
        makes an exception); NOCK below the hard floor is never placed in LP. The operator
        makes the deposit; the worker then reads the liquidity on-chain.
      properties:
        position_id: { type: string }
        nft_id: { type: integer }
        protocol: { type: string }
        label: { type: string }
        target_usd: { type: string, description: This position's share of the LP target }
        current_usd: { type: string }
        add_usd: { type: string }
        token0_symbol: { type: string }
        amount0: { type: string }
        token1_symbol: { type: string }
        amount1: { type: string }
        limited_by:
          type: string
          nullable: true
          description: Guardrail that shrank the suggestion below its target
        nock_sold_out_at_multiple:
          type: string
          nullable: true
          description: Price multiple (NOCK against the pool's other token) at which the range has sold all its NOCK
        url:
          type: string
          description: The position's page in the Uniswap app

    GlobalStatus:
      type: object
      required:
        - total_portfolio_usd
        - total_native_usd
        - total_stable_usd
        - total_fees_accrued_usd
        - total_fees_claimable_usd
        - gas_to_fee_delta_usd
        - high_water_mark_usd
        - high_water_mark_date
      properties:
        total_portfolio_usd:
          type: string
          description: |
            Total portfolio value in USD across every pillar: wallet NOCK + wallet USDC +
            wallet ETH/WETH gas + wallet AERO + tracked LP. Includes wallet gas since 2.3.0
            (a one-time step of the gas value when it started counting) and wallet AERO
            since v0.6.0 (#93: a one-time step of the wallet's AERO value when it started
            counting, which is 0 for a wallet that holds none). AERO still unclaimed in a
            gauge is NOT included, like uncollected LP fees; the total steps up by its
            value when it is claimed. Equals total_native_usd + total_stable_usd +
            total_eth_usd + wallet_aero_usd. Cash and LP targets, deviation weights, the
            high-water mark and history all use this one total.
        total_native_usd:
          type: string
          description: NOCK only, wallet plus LP, in USD. ETH is its own pillar (total_eth_usd).
        total_stable_usd:
          type: string
          description: USDC, wallet plus LP, in USD
        total_fees_accrued_usd:
          type: string
          description: All unclaimed fees across contracts
        total_fees_claimable_usd:
          type: string
          description: Fees worth claiming after gas
        gas_to_fee_delta_usd:
          type: string
          description: Net value after gas costs
        high_water_mark_usd:
          type: string
          description: Highest total_portfolio_usd stored since this database began (or the current total if higher)
        high_water_mark_date:
          type: string
          format: date-time
          description: When the high-water mark was set, the earliest stored snapshot at the peak (or now when the current total sets a new mark). Before 2.3.0 this was always the snapshot time.
        total_nock_amount:
          type: string
          description: Total NOCK token units aggregated across all tranches
          example: "107123"
        nock_floor_delta:
          type: string
          description: Signed token units relative to operator hard floor target
          example: "+7123"
        nock_floor_target:
          type: string
          description: Operator configured sovereign floor invariant in token units
          example: "100000"
        total_usdc_amount:
          type: string
          description: Total USDC stablecoin balance aggregated across wallet and pools
          example: "450.00"
        shot_advice_action:
          type: string
          description: Tactical recommended action under dual-growth thesis
          example: "HOLD & ACCRETE (Dual Growth Engine Active)"
        shot_advice_details:
          type: string
          description: Detailed explanation of tactical advisory status
          example: "Total NOCK held is 113863 (+13863 above the 100000 floor). 3 LP positions tracked: 2 ranged (2 in range), 1 full range. $0.30 of LP fees uncollected. Liquid dry powder: none (wallet USDC $930.78 less the larger of the $119.53 cash target and the $0.00 virtual tax reserve)."
        regime:
          type: string
          description: Market regime from daily RSI(14) overextension detection (see rsi_14_1d); unknown when no daily RSI was computed (too little history, or a flat series)
          enum: [normal, overextended, unknown]
        rsi_14:
          type: string
          nullable: true
          description: Latest Wilder RSI(14) over the 5-minute NOCK snapshot closes (short-term momentum pulse)
        rsi_14_1d:
          type: string
          nullable: true
          description: Latest Wilder RSI(14) over daily NOCK closes (the industry-standard "daily RSI"); drives `regime` and the Overextension Cooldown
        eth_price_usd:
          type: string
          nullable: true
          description: Live ETH/USD from the configured WETH/USDC pool (guarded against a pool with no in-range liquidity), used to value gas and LP WETH (2.3.0). Null when unpriced or absent from an older snapshot.
        wallet_gas_eth:
          type: string
          nullable: true
          description: Wallet ETH + WETH in ETH, the gas pillar (2.3.0). Counted in total_portfolio_usd; not cash, not deployable, no target. Null when not measured; never a stand-in 0.
        wallet_gas_usd:
          type: string
          nullable: true
          description: wallet_gas_eth valued at eth_price_usd (2.3.0)
        total_eth_amount:
          type: string
          nullable: true
          description: The ETH pillar in ETH, wallet gas plus every ETH/WETH leg of tracked LP (2.3.0)
        total_eth_usd:
          type: string
          nullable: true
          description: The ETH pillar in USD (2.3.0). total_native_usd + total_stable_usd + total_eth_usd + wallet_aero_usd = total_portfolio_usd.
        aero_price_usd:
          type: string
          nullable: true
          description: >
            AERO/USD, 6 decimals, from the slot0 of the configured AERO/USDC pool
            (`aero_price_pool`), read only when that pool's tokens are AERO and USDC
            and it has in-range liquidity (a pool with none has a frozen price).
            Null when it could not be read (aero_note says why) or on a snapshot from
            before v0.6.0. A required read while the wallet holds AERO (a failed read
            then fails the cycle); otherwise optional. (v0.6.0, #93)
          example: "0.417608"
        wallet_aero_amount:
          type: string
          nullable: true
          description: >
            Wallet AERO in AERO, 6 decimals: the fourth pillar. A required read (a
            failed read fails the cycle); "0.000000" is a read zero. Counted in
            total_portfolio_usd; never cash, never deployable, no target. NockNock
            states it and gives no advice to claim, sell, hold or accumulate AERO.
            Null only on a snapshot from before v0.6.0: clients show "not reported",
            never 0. (v0.6.0, #93)
          example: "1.359979"
        wallet_aero_usd:
          type: string
          nullable: true
          description: >
            wallet_aero_amount at aero_price_usd, 2 decimals. This is the AERO pillar
            in USD. "0.00" for a wallet holding none, whatever the price.
            (v0.6.0, #93)
          example: "0.57"
        unclaimed_aero_amount:
          type: string
          nullable: true
          description: >
            Sum of positions[].unclaimed_aero, 6 decimals. NOT counted in
            total_portfolio_usd. Stated only when every Aero position that could
            earn AERO was read: null when any gauge read failed, when a gauge pays
            another token, or when an aerodrome position has no gauge_address to
            read (never a partial sum and never 0 for something not read; aero_note
            names the position). "0.000000" means every gauge answered zero or, with
            no position carrying unclaimed_aero, that no staked Aero position is
            tracked. Null on a snapshot from before v0.6.0. (v0.6.0, #93)
          example: "12.043104"
        unclaimed_aero_usd:
          type: string
          nullable: true
          description: >
            unclaimed_aero_amount at aero_price_usd, 2 decimals. Null when the amount
            is null or AERO could not be priced. (v0.6.0, #93)
          example: "5.03"
        aero_note:
          type: string
          nullable: true
          description: >
            The stated reason whenever an AERO figure above is null in a live cycle
            (the price could not be read, or a gauge could not), and for a position
            whose gauge is not configured. Null when everything was read.
            (v0.6.0, #93)

    AssetAggregationSeries:
      type: object
      required: [time_points, safe_haven_series, active_protocol_series, positions_nock]
      properties:
        time_points:
          type: array
          items:
            type: string
            format: date-time
          description: Timestamps for each data point (aligned with series)
        wallet_nock_series:
          type: array
          items:
            type: string
          description: Wallet NOCK in TOKEN UNITS at each point (2.2.0). The floor chart plots this; safe_haven_series is the same holding valued in USD.
        safe_haven_series:
          type: array
          items:
            type: string
          description: USD value in immobile storage (cold wallet, staking) at each point
        active_protocol_series:
          type: array
          items:
            type: string
          description: USD value in active ranges/pools at each point
        positions_nock:
          type: array
          description: NOCK units per tracked position at each point (replaces the retired tranche_1/2/3_nock series; v2.0.0)
          items:
            type: object
            required: [position_id, series]
            properties:
              position_id:
                type: string
              series:
                type: array
                items:
                  type: string

    TotalValueVsBaseline:
      type: object
      required: [time_points, portfolio_value_series, token_price_series, high_water_mark_series]
      properties:
        time_points:
          type: array
          items:
            type: string
            format: date-time
        portfolio_value_series:
          type: array
          items:
            type: string
          description: total_portfolio_usd at each point (includes wallet gas from 2.3.0)
        token_price_series:
          type: array
          items:
            type: string
          description: Underlying token price (e.g., NOCK/USD) at each point
        high_water_mark_series:
          type: array
          items:
            type: string
          description: Rolling high-water mark line

    TickBracketHypervisor:
      type: object
      required: [current_price, brackets]
      properties:
        current_price:
          type: string
          description: Current market price (decimal string)
        brackets:
          type: array
          items:
            $ref: '#/components/schemas/TickBracket'
          description: Hard-bounded contract limit brackets

    TickBracket:
      type: object
      required: [lower_price, upper_price, liquidity_usd, in_range, distance_bps]
      properties:
        lower_price:
          type: string
        upper_price:
          type: string
        liquidity_usd:
          type: string
        in_range:
          type: boolean
        distance_bps:
          type: integer
          nullable: true
          description: >-
            Signed basis-point distance from the current (USD/NOCK) price to the
            nearest bracket edge. Null for brackets denominated in a different unit
            (e.g. ETH-per-NOCK), where a cross-unit distance would be meaningless —
            clients convert via a live ETH/USD rate before charting.

    PortfolioDeviationMatrix:
      type: object
      required: [allocations]
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationDeviation'
          description: Target vs actual for each strategy bucket

    AllocationDeviation:
      type: object
      required: [bucket_name, target_weight_bps, actual_weight_bps, deviation_bps, status]
      properties:
        bucket_name:
          type: string
          example: "Aerodrome NOCK/USDC"
        target_weight_bps:
          type: integer
          description: >
            Target allocation in basis points (targets sum = 10000). The "Gas (wallet
            ETH+WETH)" row (2.3.0) and the "AERO (wallet)" row (v0.6.0, issue 93; the
            fifth row) have no target (0, status no_target) and are never under
            rebalancing pressure.
        actual_weight_bps:
          type: integer
          description: Actual allocation in basis points of total_portfolio_usd (gas and wallet AERO included); 0 when the total is 0
        deviation_bps:
          type: integer
          description: Actual - target (positive = over-funded)
        status:
          type: string
          enum: [on_target, over_funded, under_funded, fast_running, no_target]
          description: Visual anchor for the frontend; no_target when the operator set no weight for the bucket (target_weight_bps 0)

    StructuralChannels:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/RegressionChannel'
          description: Standard-deviation corridors; old trends ghosted on break

    RegressionChannel:
      type: object
      required: [start_time, end_time, center_line, upper_1sd, lower_1sd, upper_2sd, lower_2sd, is_active, break_point]
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          nullable: true
          description: Null if channel is still active
        center_line:
          type: array
          items:
            type: object
            required: [time, value]
            properties:
              time:
                type: string
                format: date-time
              value:
                type: string
        upper_1sd:
          type: array
          items:
            type: object
            required: [time, value]
            properties:
              time:
                type: string
                format: date-time
              value:
                type: string
        lower_1sd:
          type: array
          items:
            type: object
            required: [time, value]
            properties:
              time:
                type: string
                format: date-time
              value:
                type: string
        upper_2sd:
          type: array
          items:
            type: object
            required: [time, value]
            properties:
              time:
                type: string
                format: date-time
              value:
                type: string
        lower_2sd:
          type: array
          items:
            type: object
            required: [time, value]
            properties:
              time:
                type: string
                format: date-time
              value:
                type: string
        is_active:
          type: boolean
        break_point:
          type: string
          format: date-time
          nullable: true
          description: Timestamp where price broke out, freezing this channel

    StrategyCounterfactual:
      type: object
      required: [time_points, active_portfolio_series, passive_baseline_series]
      properties:
        time_points:
          type: array
          items:
            type: string
            format: date-time
        active_portfolio_series:
          type: array
          items:
            type: string
          description: Actual portfolio growth curve (USD)
        passive_baseline_series:
          type: array
          items:
            type: string
          description: Passive "cash out at dip" baseline (USD)

    VelocityGasSandbox:
      type: object
      required: [contracts]
      properties:
        contracts:
          type: array
          items:
            $ref: '#/components/schemas/FeeCollectionIndex'
          description: Claimable volume vs gas break-even per contract

    FeeCollectionIndex:
      type: object
      required: [contract_address, contract_name, claimable_usd, gas_break_even_usd, efficiency_ratio, recommended_action]
      properties:
        contract_address:
          type: string
          pattern: '^0x[a-fA-F0-9]{40}$'
        contract_name:
          type: string
        claimable_usd:
          type: string
        gas_break_even_usd:
          type: string
        efficiency_ratio:
          type: number
          format: float
          description: claimable_usd / gas_break_even_usd
        recommended_action:
          type: string
          enum: [claim_now, claim_recommended, accumulate, not_claimable]
          description: >
            Gas-economic recommendation. not_claimable marks an Aero pool whose
            claimFees() reverts: its fees are not LP-claimable; claimable_usd is
            then 0.00 and is not an amount earned. Since v0.6.0 also an
            aerodrome-cl position staked in its gauge (see note). The AERO such a
            position earns instead is stated in note (v0.6.0, #93) and never
            changes this recommendation: no value of it means "claim AERO".
        note:
          type: string
          description: >
            With not_claimable, the reason (an aerodrome-cl position staked in its
            gauge, or an Aero basic pool whose claimFees() reverts), followed since
            #93 by "; " and the position's AERO statement, the same text as in
            contract_fees[].amount. A claimable row (claim_now, claim_recommended,
            accumulate) never carries an AERO statement: its action is about LP
            fees, and an AERO amount beside it would read as advice about AERO. That
            position's AERO is in positions[].unclaimed_aero. Absent when there is
            nothing to say; a snapshot from before #93 carries no note for an Aero
            basic pool, and clients then say its AERO is not reported. (v0.6.0)

    # ============================================================
    # INPUT TYPES FOR WASM FUNCTIONS
    # ============================================================
    IngestionConfig:
      type: object
      required:
        - alchemy_api_keys
        - tracked_wallets
        - tracked_pools
        - tracked_ranges
        - fee_contracts
        - sync_window_seconds
      properties:
        alchemy_api_keys:
          type: array
          items:
            type: string
          description: Premium Alchemy API keys (rotated)
        tracked_wallets:
          type: array
          items:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
        tracked_pools:
          type: array
          items:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
        tracked_ranges:
          type: array
          items:
            type: string
            description: Range IDs for concentrated liquidity
        fee_contracts:
          type: array
          items:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
        sync_window_seconds:
          type: integer
          default: 300
          description: Max age before data is considered stale (default 5 min)

    RawOnChainData:
      type: object
      required:
        - wallet_balances_raw
        - pool_states_raw
        - range_states_raw
        - fee_states_raw
      properties:
        wallet_balances_raw:
          type: array
          items:
            type: object
            # Alchemy getTokenBalances response shape
        pool_states_raw:
          type: array
          items:
            type: object
            # Pool state from Alchemy/subgraph
        range_states_raw:
          type: array
          items:
            type: object
            # Position state from Uniswap V4 subgraph
        fee_states_raw:
          type: array
          items:
            type: object
            # Fee accrual state

    FreshnessResult:
      type: object
      required: [is_fresh, age_seconds, state_hash]
      properties:
        is_fresh:
          type: boolean
        age_seconds:
          type: integer
        state_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'