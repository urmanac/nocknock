[package]
name = "nocknock-brain"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Urmanac"]
description = "Pure ingestion logic for NockNock — compiled to WASM, zero external deps"

[lib]
crate-type = ["cdylib"]

[dependencies]
# WASM host imports (logger, http, storage) — provided by host at runtime
extism-pdk = { version = "1.4.1", default-features = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto for state hashing
sha2 = "0.10"

# Time parsing
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }

# ULID generation
ulid = "1.0"

# Decimal math for precise financial calculations
rust_decimal = { version = "1.40", features = ["serde", "std"], default-features = true }
rust_decimal_macros = "1.40"

# Schema validation (optional, for debug builds)
schemars = { version = "0.8", optional = true }

[features]
default = []
validate = ["dep:schemars"]

[profile.release]
# Optimize for size — WASM runs in constrained environments
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"